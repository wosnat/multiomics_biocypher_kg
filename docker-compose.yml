version: '3.3'

services:

  build:
    image: biocypher/base:1.2.0
    container_name: build
    network_mode: host
    volumes:
      - biocypher_neo4j_volume:/usr/app/data
      - .:/src/
      - build_cache:/cache
    command:
      - /bin/bash
      - /src/scripts/build.sh
    environment:
      BUILD2NEO_CLEANUP: "yes"
      # Set to "yes" to include GO/EC hierarchy nodes and edges
      BUILD_GO: "no"
      BUILD_EC: "no"

  import:
    image: neo4j:5.15-community
    container_name: import
    # Run as root (bypassing the neo4j docker-entrypoint which drops to the
    # unprivileged neo4j user) so the trap in import.sh can chmod /output —
    # a root-owned bind mount — and write import.status / import.report.
    user: root
    entrypoint: /bin/bash
    environment:
      NEO4J_AUTH: none
    volumes:
      - biocypher_neo4j_volume:/data
      - ./scripts/import.sh:/scripts/import.sh
      - ./output:/output
    command:
      - /scripts/import.sh
    depends_on:
      build:
        condition: service_completed_successfully

  post-process:
    image: neo4j:5.15-community
    container_name: post-process
    volumes:
      - biocypher_neo4j_volume:/data
      - ./scripts/post-import.cypher:/scripts/post-import.cypher
      - ./scripts/post-import.sh:/scripts/post-import.sh
      # Read-only mount so post-import.sh can resolve the project default for
      # KG_MCP_MIN_VERSION when no env override is set (dev `docker compose up`).
      - ./pyproject.toml:/scripts/pyproject.toml:ro
    environment:
      NEO4J_AUTH: none
      NEO4J_dbms_security_auth__enabled: "false"
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_server_memory_heap_initial__size: "2G"
      NEO4J_server_memory_heap_max__size: "4G"
      # Forward release-stamp env vars. Empty defaults are intentional: post-
      # import.sh uses ${VAR:-default} which fires on unset OR empty. When the
      # caller is /release-kg these are populated from git/pyproject; when it
      # is a dev `docker compose up -d` they are empty and post-import.sh reads
      # mcp_min_version from the mounted pyproject.toml above.
      KG_MCP_MIN_VERSION: ${KG_MCP_MIN_VERSION:-}
      # Self-declared deployment role. Unset here → post-import.sh defaults to
      # 'local-dev' (a plain `docker compose up` is a local-dev deployment);
      # /release-kg sets 'staging' / 'production' for its build stacks.
      KG_DEPLOYMENT_ROLE: ${KG_DEPLOYMENT_ROLE:-}
    command:
      - /bin/bash
      - /scripts/post-import.sh
    depends_on:
      import:
        condition: service_completed_successfully

  deploy:
    image: neo4j:5.15-community
    container_name: deploy
    volumes:
      - biocypher_neo4j_volume:/data
    environment:
      NEO4J_dbms_security_auth__enabled: "false"
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_server_memory_heap_initial__size: "1G"
      NEO4J_server_memory_heap_max__size: "2G"
    ports:
      - "${KG_DEPLOY_HTTP_BIND:-127.0.0.1:7474}:7474"
      - "${KG_DEPLOY_BOLT_BIND:-127.0.0.1:7687}:7687"
    networks:
      - biochatter
    depends_on:
      post-process:
        condition: service_completed_successfully

  app:
    image: biocypher/biochatter-light:0.6.13
    container_name: app
    ports:
      - "8501:8501"
    networks:
      - biochatter
    depends_on:
      import:
        condition: service_completed_successfully
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - DOCKER_COMPOSE=true
      - CHAT_TAB=false
      - PROMPT_ENGINEERING_TAB=false
      - RAG_TAB=false
      - CORRECTING_AGENT_TAB=false
      - KNOWLEDGE_GRAPH_TAB=true


volumes:
  biocypher_neo4j_volume:
  build_cache:

networks:
  biochatter: