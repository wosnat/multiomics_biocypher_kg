# Generated by scripts/build_modified_csv/build_ford2021_sbp_classes.py — edit the script, not this file.
# Ford 2021 is a review: no experiments, no DE. Its Supplementary Data S1 lists the 1,257
# ABC substrate-binding proteins (SBPs) Cyanorak v2.1 annotates across 97 picocyanobacterial
# genomes. Each strain gets an experiment-less derived_metrics_table (bioinformatic analysis,
# treatment_type [genomic_analysis]) with two categorical metrics: the paper's Figure 2 nutrient
# class and its predicted substrate, both called per Cyanorak cluster.
# 01whole.pdf is the first author's 2017 MRes thesis on Synechococcus SBPs (background only).
publication:
  papername: "Ford 2021"
  doi: "10.1042/BST20200244"
  papermainpdf: "data/Synechococcus/papers_and_supp/Ford 2021/bst-2020-0244c.pdf"

  supplementary_materials:
    ns01_sbp:
      type: derived_metrics_table
      filename: "data/Synechococcus/papers_and_supp/Ford 2021/sbp_classes/NS01_sbp_classes.csv"
      organism: "Cyanobium NS01"
      treatment_type: [genomic_analysis]   # bioinformatic: no experiment, no culture context
      treatment: "Genome annotation survey of ABC-transporter substrate-binding proteins (no experimental treatment)"
      experimental_context: "15 SBP genes found by text search of Cyanorak v2.1 annotations (Ford 2021 Supplementary Data S1); classes and substrates are the per-cluster calls of the paper."
      name_col: "Cyanorak ID"
      id_columns:
        - column: "Cyanorak ID"
          id_type: locus_tag_cyanorak
      product_columns:
        - column: "product"
      metrics:
        - metric_type: sbp_nutrient_class
          name: "Predicted SBP nutrient class (Ford 2021)"
          value_kind: categorical
          value_col: nutrient_class
          allowed_categories:
            - "carbon"
            - "nitrogen"
            - "phosphorus"
            - "sulfur"
            - "trace_metals"
            - "unknown"
          field_description: "Major nutrient class of the ABC substrate-binding protein (SBP), from Ford 2021 Figure 2: carbon, nitrogen, phosphorus, sulfur, trace_metals, or unknown (hypothetical/unknown-function clusters). Called per Cyanorak cluster and inherited by each member gene. Prediction from genome annotation, not experimentally validated."
        - metric_type: sbp_predicted_substrate
          name: "Predicted SBP substrate (Ford 2021)"
          value_kind: categorical
          value_col: predicted_substrate
          allowed_categories:
            - "amino_acids"
            - "cobalt_nickel"
            - "cyanate"
            - "glucose_glycerol_trehalose"
            - "glycine_betaine"
            - "hypothetical_phosphonate"
            - "iron"
            - "iron_siderophore"
            - "manganese"
            - "manganese_zinc"
            - "molybdenum"
            - "nitrate"
            - "nitrate_nitrite"
            - "peptide"
            - "phosphate"
            - "phosphonate"
            - "sugar"
            - "urea"
            - "zinc"
            - "not_stated"
          field_description: "Substrate the paper predicts for the Cyanorak cluster of the SBP (Ford 2021 Figure 1, Table 1 and text), inherited by each member gene; not_stated when the paper names none. Some clusters with a stated substrate sit in the unknown nutrient class (Figure 2 hypothetical group). Prediction from genome annotation, not experimentally validated."

