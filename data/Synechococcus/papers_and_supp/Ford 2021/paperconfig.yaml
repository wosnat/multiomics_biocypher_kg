      name: "Cyanobium NS01 ABC substrate-binding protein annotation survey (Ford 2021)"
      organism: "Cyanobium NS01"
      omics_type: BIOINFORMATIC
      treatment_type: [genomic_analysis]
      background_factors: []   # computed from genome annotation: no sample, no culture
      treatment_condition: "Text search of Cyanorak v2.1 annotations for ABC-transporter substrate-binding proteins (no experimental treatment)"
      experimental_context: "15 SBP genes in this genome (Ford 2021 Supplementary Data S1); nutrient class and predicted substrate are the per-Cyanorak-cluster calls of the paper (Figures 1-2, Table 1, text), not experimentally validated."
