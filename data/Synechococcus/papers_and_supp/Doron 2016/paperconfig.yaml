publication:
  papername: "Doron 2016"
  doi: "10.1038/ismej.2015.210"
  papermainpdf: "data/Synechococcus/papers_and_supp/Doron 2016/41396_2016_article_bfismej2015210.pdf"

  experiments:
    syn9_infection_wh7803:
      name: "WH7803 cyanophage Syn9 infection time course (microarray)"
      organism: "Synechococcus WH7803"
      omics_type: MICROARRAY
      test_type: microarray
      treatment_condition: "Infection with broad-host-range cyanomyovirus Syn9 (MOI 2-3, ~2 h after lights-on)"
      control_condition: "Uninfected parallel control cultures"
      treatment_type: [viral]
      background_factors: [diel]
      treatment_organism: Phage
      treatment_taxid: 10239
      experimental_context: "Synechococcus WH7803 infected with cyanophage Syn9; whole-genome oligo microarray of infected vs uninfected cultures at 7 timepoints over 4 h (2-5 min, then 30-240 min); values are per-timepoint infected/control log-ratios (limma). The single F / P.Value / adj.P.Val triplet is limma's OMNIBUS series-level test."
      medium: "ASW (artificial seawater, Wyman et al. 1985 with Lindell et al. 1998 modifications)"
      temperature: "22C"
      light_condition: "14:10 light:dark cycle, cool white light"
      light_intensity: "30 umol photons m-2 s-1"
      table_scope: all_detected_genes
      table_scope_detail: "All host probes on the array (WH7803); 232 BSV9_* Syn9 phage probes filtered out at CSV-generation time (no Gene nodes). adjusted_p_value is wired ONLY on the terminal 4 h timepoint and is limma's omnibus series-level FDR ('this gene changed at some point in the series'), not a timepoint-specific test; the other six timepoints carry log-ratios with null adjusted_p_value (decision D7(a))."

