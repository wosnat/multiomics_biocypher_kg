  supplementary_materials:
    # Derived from GSE63690_Processed_data_WH7803.txt.gz by
    # scripts/build_modified_csv/build_doron2016_host_tables.py
    # (phage probes dropped; locus_tag = Probe ID minus '_at')
    host_de_wh7803:
      type: csv
      filename: "data/Synechococcus/papers_and_supp/Doron 2016/doron2016_wh7803_host_de.csv"
      organism: "Synechococcus WH7803"
      id_columns:
        - column: locus_tag
          id_type: locus_tag
      product_columns:
        - column: description
      statistical_analyses:
        - id: doron2016_wh7803_syn9_0min
          experiment: syn9_infection_wh7803
          timepoint: "2-5 min"
          # the array's nominal-0 column (S0.C0 / SYN9.0.C0) is the paper's
          # 2-5 min post-infection sample, not time zero
          timepoint_hours: 0.083
          growth_phase: infected
          name_col: "locus_tag"
          logfc_col: "S0.C0"
          prefiltered: false
        - id: doron2016_wh7803_syn9_30min
          experiment: syn9_infection_wh7803
          timepoint: "30 min"
          timepoint_hours: 0.5
          growth_phase: infected
          name_col: "locus_tag"
          logfc_col: "S30.C30"
          prefiltered: false
        - id: doron2016_wh7803_syn9_60min
          experiment: syn9_infection_wh7803
          timepoint: "60 min"
          timepoint_hours: 1.0
          growth_phase: infected
          name_col: "locus_tag"
          logfc_col: "S60.C60"
          prefiltered: false
        - id: doron2016_wh7803_syn9_90min
          experiment: syn9_infection_wh7803
          timepoint: "90 min"
          timepoint_hours: 1.5
          growth_phase: infected
          name_col: "locus_tag"
          logfc_col: "S90.C90"
          prefiltered: false
        - id: doron2016_wh7803_syn9_120min
          experiment: syn9_infection_wh7803
          timepoint: "120 min"
          timepoint_hours: 2.0
          growth_phase: infected
          name_col: "locus_tag"
          logfc_col: "S120.C120"
          prefiltered: false
        - id: doron2016_wh7803_syn9_180min
          experiment: syn9_infection_wh7803
          timepoint: "180 min"
          timepoint_hours: 3.0
          growth_phase: infected
          name_col: "locus_tag"
          logfc_col: "S180.C180"
          prefiltered: false
        - id: doron2016_wh7803_syn9_240min
          experiment: syn9_infection_wh7803
          timepoint: "240 min"
          timepoint_hours: 4.0
          growth_phase: infected
          name_col: "locus_tag"
          logfc_col: "S240.C240"
          # limma omnibus series-level BH-adjusted F-test p — see table_scope_detail
          adjusted_p_value_col: "adj.P.Val"
          pvalue_threshold: 0.05
          prefiltered: false

