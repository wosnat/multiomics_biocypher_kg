# Christie-Oleza, Armengaud, Guerin & Scanlan 2015, Environ Microbiol 17:3781-3794,
# "Functional distinctness in the exoproteomes of marine Synechococcus".
# Not the same paper as "Oleza 2015" (Proteomics 2015, DSS-3 exoproteome).
# CSVs + per-strain protein FASTAs built by scripts/build_modified_csv/build_oleza2015b_exoproteomes.py.
# Tables used: S4 (exoproteome % NSAF per strain, 8 Synechococcus strains) -> derived metrics;
#   S6 (WH8102 comparative exoproteomics, 4 PatternLab TFold contrasts) -> DE.
# Skipped: S1 (SignalP / SecretomeP / LipoP predictions - the KG runs SignalP itself),
#   S2 (in-silico homology table + tentative functional clusters), S3 / S5 (peptide lists and
#   per-sample protein lists - S4 and S6 carry the same proteins summarised).
# Protein accessions are 2012 NCBI ones (NP_/YP_/ZP_/EAx). BL107 / RS9917 (ZP_), CC9311 (YP_) and
# WH8102 (NP_) do not resolve in the current mappings: each gets an id_translation generated by
# diamond_protein_match from the sequences printed in the tables (exact / subsequence / diamond
# >= 97.9% identity). The other 4 strains resolve directly (EAx GenBank, WH7803 YP_).
publication:
  papername: "Oleza 2015b"
  doi: "10.1111/1462-2920.12822"
  papermainpdf: "data/Synechococcus/papers_and_supp/Oleza 2015b/Environmental Microbiology - 2015 - Christie‐Oleza - Functional distinctness in the exoproteomes of marine Synechococcus.pdf"
  control_timing: matched

  experiments:
    exoproteome_bl107:
      name: "Synechococcus sp. BL107 exoproteome composition under standard growth (Christie-Oleza 2015b)"
      organism: "Synechococcus sp. BL107"
      omics_type: EXOPROTEOMICS
      compartment: exoproteome
      treatment_type: [compartment]
      background_factors: [light]
      treatment_condition: "Cell-free culture supernatant (exoproteome) under standard growth; no perturbation"
      experimental_context: "Synechococcus sp. BL107 (clade IV; clonal but non-axenic (heterotrophic contaminants not identified)). Washed cells resuspended at 3e7 cells/ml in fresh ASW and grown at 22C, 10 umol photons m-2 s-1 to 1e8 cells/ml; supernatant 0.22 um filtered, TCA-precipitated, shotgun nanoLC-MS/MS (LTQ-Orbitrap XL), proteins validated with >=2 unique peptides; % NSAF per replicate, 2 biological replicates (each run twice by LC-MS/MS: A1/A2, B1/B2) (Table S4)."
      medium: "ASW"
      temperature: "22C"
      light_condition: "continuous light"
      light_intensity: "10 umol photons m-2 s-1"
      table_scope: filtered_subset
      table_scope_detail: "Exoproteins detected with >=2 unique peptides in this strain, plus BLASTp homologues (E < 1e-20) of exoproteins detected in the other strains (listed as not detected)"
