    table_s4_bl107_exoproteome:
      type: derived_metrics_table
      filename: "data/Synechococcus/papers_and_supp/Oleza 2015b/table_s4_BL107_exoproteome_nsaf.csv"
      organism: "Synechococcus sp. BL107"
      experiment: exoproteome_bl107
      name_col: protein_id
      id_columns:
        - column: protein_id
          id_type: annotation_specific
      product_columns:
        - column: annotated_function
      metrics:
        - metric_type: exoproteome_avg_pct_nsaf
          name: "Avg % NSAF in Synechococcus sp. BL107 exoproteome (Table S4)"
          value_kind: numeric
          value_col: avg_pct_nsaf
          unit: "% NSAF"
          rankable: "true"
          has_p_value: "false"
          field_description: "Average % NSAF (normalized spectral abundance factor: spectral counts / molecular weight, normalised to the sum over all proteins validated with >=2 unique peptides) of this protein in the cell-free culture supernatant of Synechococcus sp. BL107 under standard growth, averaged over the replicates (Christie-Oleza 2015b Table S4). Blank (no edge) when the protein was not detected. Higher = more abundant in the exoproteome."
        - metric_type: exoproteome_detection_status
          name: "Detection status in Synechococcus sp. BL107 exoproteome (Table S4)"
          value_kind: categorical
          value_col: detection_status
          allowed_categories:
            - detected
            - sporadic
            - not_detected
          field_description: "Detection in the Synechococcus sp. BL107 exoproteome from the per-replicate % NSAF values of Table S4: detected = non-zero in every biological replicate, sporadic = non-zero in some, not_detected = zero in all. not_detected is only assigned to the proteins Table S4 lists, i.e. BLASTp homologues (E < 1e-20) of exoproteins detected in another of the 8 strains; other genes carry no edge. Technical re-runs of one biological replicate (BL107 A1/A2, B1/B2) count as one replicate, detected if either run is."
