publication:
  papername: "Johnson 2026b"
  doi: "10.64898/2026.04.15.718746"  # bioRxiv post-2025 openRxiv prefix — 10.1101/... 404s
  papermainpdf: "data/Prochlorococcus/papers_and_supp/Johnson 2026b/2026.04.15.718746v1.full.pdf"
  # NOTE: this is the iModulon preprint (Johnson, Sadler, ..., Bohutskyi; PNNL;
  # GSE314951) — NOT the whole-cell-modeling preprint 2026.01.21.700212 that
  # sits in "Johnson 2026/" and merely cites the same GEO series (plan F8).

  experiments:
    extended_darkness_med4:
      name: "MED4 extended darkness past dawn vs normal light period (RNA-seq)"
      organism: "Prochlorococcus MED4"
      omics_type: RNASEQ
      test_type: DESeq2
      treatment_type: [darkness]
      background_factors: [axenic, diel]
      treatment_condition: "Extended darkness across dawn: lights NOT turned on at ZT 0, darkness continued into the subjective circadian day"
      control_condition: "Normal diel light period (time-matched controls)"
      experimental_context: "Diel-entrained MED4 monoculture in Pro99 at 21C, 12:12 light:dark (>=180 days entrainment); darkness extended past dawn (lights never turned on at ZT 0) and sampled at ZT 2 and 4 h (= 2 and 4 h into the extension); DESeq2 vs time-matched normal-light controls; authors' significance cutoff padj < 0.05. All 1,920 detected genes present in each contrast."
      medium: "Pro99"
      temperature: "21C"
      light_condition: "12:12 light:dark cycle"
      light_intensity: "~45 umol photons m-2 s-1"
      table_scope: all_detected_genes

    extended_light_med4:
      name: "MED4 extended light past dusk vs normal dark period (RNA-seq)"
      organism: "Prochlorococcus MED4"
      omics_type: RNASEQ
      test_type: DESeq2
      treatment_type: [light]
      background_factors: [axenic, diel]
      treatment_condition: "Extended light across dusk: lights NOT turned off at ZT 12, light continued into the subjective circadian night"
      control_condition: "Normal diel dark period (time-matched controls)"
      experimental_context: "Diel-entrained MED4 monoculture in Pro99 at 21C, 12:12 light:dark (>=180 days entrainment); light extended past dusk (lights never turned off at ZT 12) and sampled at ZT 14 and 16 h (= 2 and 4 h into the extension); DESeq2 vs time-matched normal-dark controls; authors' significance cutoff padj < 0.05. All 1,920 detected genes present in each contrast (one gene has NaN stats at 16 h)."
      medium: "Pro99"
      temperature: "21C"
      light_condition: "12:12 light:dark cycle"
      light_intensity: "~45 umol photons m-2 s-1"
      table_scope: all_detected_genes

  supplementary_materials:
    # Built from media-2.xlsx DESeq2 sheets by
    # scripts/build_modified_csv/build_johnson2026b_de_csvs.py
    # (headers carry embedded newlines in the source; exported flat).
    # The DIMA sheets (per-iModulon activity) and media-3 diel metrics /
    # media-8 iModulon memberships are deferred — plans/backlog.md
    # ("GEO processed-supplements drop": 2.1B, 2.1C, D5).
    de_dark_vs_light:
      type: csv
      filename: "data/Prochlorococcus/papers_and_supp/Johnson 2026b/johnson2026b_dark_vs_light_2_4h.csv"
      organism: "Prochlorococcus MED4"
      id_columns:
        - column: refseq_locus
          id_type: locus_tag_ncbi   # TX50_RS##### (MED4 RefSeq)
      statistical_analyses:
        - id: johnson2026b_med4_dark_vs_light_2h
          experiment: extended_darkness_med4
          timepoint: "2h"
          timepoint_hours: 2.0
          growth_phase: diel
          name_col: "refseq_locus"
          logfc_col: "log2fc_2h"
          adjusted_p_value_col: "padj_2h"
          pvalue_threshold: 0.05
          prefiltered: false
        - id: johnson2026b_med4_dark_vs_light_4h
          experiment: extended_darkness_med4
          timepoint: "4h"
          timepoint_hours: 4.0
          growth_phase: diel
          name_col: "refseq_locus"
          logfc_col: "log2fc_4h"
          adjusted_p_value_col: "padj_4h"
          pvalue_threshold: 0.05
          prefiltered: false

    de_light_vs_dark:
      type: csv
      filename: "data/Prochlorococcus/papers_and_supp/Johnson 2026b/johnson2026b_light_vs_dark_14_16h.csv"
      organism: "Prochlorococcus MED4"
      id_columns:
        - column: refseq_locus
          id_type: locus_tag_ncbi
      statistical_analyses:
        - id: johnson2026b_med4_light_vs_dark_14h
          experiment: extended_light_med4
          timepoint: "14h"
          timepoint_hours: 14.0
          growth_phase: diel
          name_col: "refseq_locus"
          logfc_col: "log2fc_14h"
          adjusted_p_value_col: "padj_14h"
          pvalue_threshold: 0.05
          prefiltered: false
        - id: johnson2026b_med4_light_vs_dark_16h
          experiment: extended_light_med4
          timepoint: "16h"
          timepoint_hours: 16.0
          growth_phase: diel
          name_col: "refseq_locus"
          logfc_col: "log2fc_16h"
          adjusted_p_value_col: "padj_16h"
          pvalue_threshold: 0.05
          prefiltered: false
