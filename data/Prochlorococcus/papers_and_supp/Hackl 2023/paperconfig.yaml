publication:
  papername: "Hackl 2023"
  doi: "10.1016/j.cell.2022.12.006"
  papermainpdf: "data/Prochlorococcus/papers_and_supp/Hackl 2023/PIIS0092867422015197.pdf"

  experiments:
    mmc_dna_damage_mit0604:
      name: "MIT0604 mitomycin C DNA-damage induction vs untreated control (RNA-seq)"
      organism: "Prochlorococcus MIT0604"
      omics_type: RNASEQ
      test_type: DESeq2
      treatment_type: [chemical]
      background_factors: [axenic]
      treatment_condition: "Mitomycin C 15 ug/mL for 2 h (DNA-crosslinking damage; induces integrases/excisionases and mobilizes tycheposons)"
      control_condition: "Untreated parallel cultures"
      experimental_context: "Triplicate 30 mL exponential-phase MIT0604 cultures (the paper grows cultures axenically 'except ... MIT0604 when specified'; the RNA-seq methods specify nothing, so axenic is the default reading); strand-specific RNA-seq (KAPA HyperPrep + RiboZero); DESeq2 Wald test, BH correction, authors' significance cutoff padj < 0.1. Sense-strand quantification (antisense tables deferred, see plans/backlog.md D8)."
      medium: "Pro99 (Sargasso seawater based)"
      temperature: "24C"
      light_condition: "continuous light"
      light_intensity: "30-40 umol photons m-2 s-1"
      table_scope: all_detected_genes
      table_scope_detail: "Unfiltered DESeq2 output, 2,047 rows (authors' custom MIT0604_* annotation bridged to Cyanorak ids via prefix id_translation)"

    uv_dna_damage_mit0604:
      name: "MIT0604 UV shock vs untreated control (RNA-seq)"
      organism: "Prochlorococcus MIT0604"
      omics_type: RNASEQ
      test_type: DESeq2
      treatment_type: [light]
      background_factors: [axenic]
      treatment_condition: "UV shock: 30 s at 254 nm (100 mW cm-2) in open petri dish, then 1 h recovery in normal culture conditions"
      control_condition: "Untreated parallel cultures (same handling, no irradiation)"
      experimental_context: "Triplicate 30 mL exponential-phase MIT0604 cultures; strand-specific RNA-seq; DESeq2 Wald test, BH correction, authors' significance cutoff padj < 0.1. UV shock did NOT significantly induce the integrase (the paper's negative control for mitomycin C's effect). Sense-strand quantification (antisense tables deferred)."
      medium: "Pro99 (Sargasso seawater based)"
      temperature: "24C"
      light_condition: "continuous light"
      light_intensity: "30-40 umol photons m-2 s-1"
      table_scope: all_detected_genes
      table_scope_detail: "Unfiltered DESeq2 output, 2,047 rows"

    mmc_vs_uv_mit0604:
      name: "MIT0604 mitomycin C vs UV shock (treatment-vs-treatment contrast, RNA-seq)"
      organism: "Prochlorococcus MIT0604"
      omics_type: RNASEQ
      test_type: DESeq2
      treatment_type: [chemical]
      background_factors: [axenic]
      treatment_condition: "Mitomycin C 15 ug/mL for 2 h"
      control_condition: "UV shock arm (30 s 254 nm + 1 h recovery) — treatment-vs-treatment contrast, NOT an untreated baseline"
      experimental_context: "Direct DESeq2 contrast between the two DNA-damage arms; positive log2FC = higher in mitomycin C. Both arms from the same triplicate experiment as the vs-control contrasts. Sense-strand quantification."
      medium: "Pro99 (Sargasso seawater based)"
      temperature: "24C"
      light_condition: "continuous light"
      light_intensity: "30-40 umol photons m-2 s-1"
      table_scope: all_detected_genes
      table_scope_detail: "Unfiltered DESeq2 output, 2,047 rows"

  supplementary_materials:
    # Generated by scripts/build_modified_csv/build_hackl2023_mit0604_id_translation.py
    # (F4: authors' MIT0604_* = Cyanorak CK_Pro_MIT0604_* minus the CK_Pro_ prefix)
    mit0604_id_translation:
      type: id_translation
      filename: "data/Prochlorococcus/papers_and_supp/Hackl 2023/mit0604_id_translation.csv"
      organism: "Prochlorococcus MIT0604"
      id_columns:
        - column: mit0604_id
          id_type: alternative_locus_tag
        - column: locus_tag
          id_type: locus_tag

    # Derived from mmc2.xlsx (Table S2 island intervals) by
    # scripts/build_modified_csv/build_hackl2023_island_membership.py
    # (coordinate containment against gene_annotations_merged.json;
    #  MIT1327 excluded — different assembly, needs coordinate remap)
    med4_genomic_islands:
      type: gene_clusters
      name: "MED4 predicted genomic islands (Hackl 2023)"
      filename: "data/Prochlorococcus/papers_and_supp/Hackl 2023/islands/MED4_island_membership.csv"
      organism: "Prochlorococcus MED4"
      gene_id_col: "locus_tag"
      cluster_col: "island_id"
      id_columns:
        - column: locus_tag
          id_type: locus_tag
      cluster_type: "genomic_island"
      cluster_method: "Tycheposon-pipeline genomic island prediction (Hackl 2023 Table S2)"
      treatment: "Genomic island prediction from genome sequence (no experimental treatment)"
      experimental_context: "Predicted variable-region genomic islands transferred onto the deployed assembly by coordinate containment (gene fully inside the mmc2 interval; assembly frame verified against mmc1, delta <= 236 bp). island_id encodes contig + start + end. Islands are predicted variable regions within one genome — NOT a pangenome core/flexible label. No per-island narrative exists; functional_description stays null."

