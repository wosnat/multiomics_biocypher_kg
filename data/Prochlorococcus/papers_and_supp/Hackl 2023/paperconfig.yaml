    de_mmc_vs_control_sense:
      type: csv
      filename: "data/Prochlorococcus/papers_and_supp/Hackl 2023/GSE171435_MMC_vs_control_sense.csv"
      organism: "Prochlorococcus MIT0604"
      id_columns:
        - column: gene
          id_type: alternative_locus_tag
      statistical_analyses:
        - id: hackl2023_mit0604_mmc_vs_control_sense
          experiment: mmc_dna_damage_mit0604
          timepoint: "2h"
          timepoint_hours: 2.0
          growth_phase: acute_stress
          name_col: "gene"
          logfc_col: "log2FoldChange (positive means more highly expressed in mitomycin C treatment)"
          adjusted_p_value_col: "padj"
          pvalue_threshold: 0.1
          prefiltered: false

