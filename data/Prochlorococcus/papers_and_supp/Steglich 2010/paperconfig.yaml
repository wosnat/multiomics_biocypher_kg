publication:
  papername: "Steglich 2010"
  doi: "10.1186/gb-2010-11-5-r54"
  papermainpdf: "data/Prochlorococcus/papers_and_supp/Steglich 2010/gb-2010-11-5-r54.pdf"

  experiments:
    rifampicin_rna_decay_med4:
      name: "MED4 genome-wide mRNA half-life measurement (rifampicin transcription arrest)"
      organism: "Prochlorococcus MED4"
      omics_type: MICROARRAY
      treatment_condition: "Rifampicin transcription arrest (150 ug/ml); transcript decay sampled at 0, 2.5, 5, 10, 20, 40, 60 min"
      # Rifampicin is the measurement METHOD (arrest transcription, watch decay),
      # not a perturbation whose response is reported — so no treatment_type;
      # the chemical presence is a background factor.
      treatment_type: []
      background_factors: [axenic, chemical, light]
      experimental_context: "Axenic Prochlorococcus MED4 in Sargasso-seawater-based Pro99 at 21C under 30 umol quanta m-2 s-1 continuous cool white light (growth rate 0.325 per day); triplicate cultures split into seven subcultures; rifampicin dissolved in Pro99 (no organic solvent) to 150 ug/ml final; decay followed on high-density Affymetrix MD4-9313 microarrays; per-gene half-life and decay rate fitted from the 0-60 min series"
      medium: "Pro99 (Sargasso seawater based)"
      temperature: "21C"
      light_condition: "continuous cool white light"
      light_intensity: "30 umol quanta m-2 s-1"
      table_scope: all_detected_genes
      table_scope_detail: "Whole-transcriptome half-life table (2,043 features incl. pseudogene/ncRNA/operon features absent from the gene layer)."

  supplementary_materials:
    # Built from 13059_2010_2347_MOESM5_ESM.XLS ("Additional file 1"'s table;
    # the legend's file descriptions are scrambled relative to MOESM numbers) by
    # scripts/build_modified_csv/build_steglich2010_halflife_csv.py
    # Deliberately NOT wired: MOESM6 (operon-organized genes — its half-life/
    # decay values are 220/220 numerically identical to MOESM5; unique content
    # is operon membership/position, no schema slot — Tier 3 operon layer);
    # MOESM7 (operon-level Chen 2004 comparison, no per-gene metrics);
    # MOESM8 (qRT-PCR oligo list); MOESM1-4 PPTs + MOESM10-15 PDFs (figures).
    halflife_table:
      type: derived_metrics_table
      filename: "data/Prochlorococcus/papers_and_supp/Steglich 2010/steglich2010_halflife_modified.csv"
      organism: "Prochlorococcus MED4"
      experiment: rifampicin_rna_decay_med4
      name_col: new_annotation
      id_columns:
        - column: new_annotation
          id_type: alternative_locus_tag   # PMED4_XXXXX (new annotation)
        - column: old_annotation
          id_type: locus_tag               # PMM#### (canonical MED4 locus tag)
      product_columns:
        - column: gene_function
      metrics:
        - metric_type: rna_half_life_min
          name: "mRNA half-life (min)"
          value_kind: numeric
          value_col: half_life_min
          unit: "min"
          rankable: "true"
          has_p_value: "false"
          field_description: "Fitted mRNA half-life in minutes after rifampicin transcription arrest (median 2.4 min for expressed genes; 3.4 min over the whole table). Higher = more stable transcript. Caveat: fits for genes below the expression threshold (expressed_above_background = false) are unreliable, and half-lives of very highly expressed genes are saturation-inflated (paper: psbA 40 min by array vs 18 min by qPCR). Standard error per gene in source column half_life_se_min (kept in the CSV, not wired as a metric)."

        - metric_type: rna_decay_time_min
          name: "mRNA decay time (min per twofold decrease)"
          value_kind: numeric
          value_col: decay_time_min
          unit: "min"
          rankable: "true"
          has_p_value: "false"
          field_description: "Two-phase-fit mRNA decay time in minutes per twofold decrease, measured relative to the timepoint of maximal expression (the paper idiosyncratically calls this 'decay rate'; it is a TIME, not a rate constant). Higher = MORE stable — same direction as rna_half_life_min, which it complements (different fitting approach; median 2.6 min for expressed genes). Standard error and error-interval bounds per gene in source columns decay_time_se_min / decay_time_lower / decay_time_upper (kept in the CSV, not wired as metrics)."

        - metric_type: expression_at_t0_log2
          name: "Expression at t0 (log2)"
          value_kind: numeric
          value_col: expression_t0_log2
          unit: "log2"
          rankable: "true"
          has_p_value: "false"
          field_description: "log2 microarray expression level at 0 min (before rifampicin addition) — the steady-state abundance baseline the decay fit starts from."

        - metric_type: expressed_above_background
          name: "Expressed above background at t0"
          value_kind: boolean
          value_col: expressed
          true_tokens: ["True", "true"]
          false_tokens: ["False", "false"]
          skip_tokens: ["NA", "N/A"]
          blank_policy: skip
          field_description: "The paper's expression-threshold call at t0. false = below background — the paper excluded these genes from its global half-life statistics and clustering, and their decay fits are unreliable. Use as a reliability filter on rna_half_life_min / rna_decay_time_min."

    decay_clusters:
      type: gene_clusters
      name: "MED4 mRNA decay-pattern clusters (Steglich 2010)"
      filename: "data/Prochlorococcus/papers_and_supp/Steglich 2010/steglich2010_halflife_modified.csv"
      organism: "Prochlorococcus MED4"
      gene_id_col: "new_annotation"
      cluster_col: "decay_cluster"
      id_columns:
        - column: new_annotation
          id_type: alternative_locus_tag
        - column: old_annotation
          id_type: locus_tag
      cluster_type: "decay_pattern"
      cluster_method: "Soft clustering (Mfuzz, m=2, 12 clusters) of rifampicin decay time-course profiles"
      omics_type: MICROARRAY
      treatment_type: []
      background_factors: [axenic, chemical, light]
      treatment: "Rifampicin transcription arrest, 0-60 min mRNA decay time course"
      light_condition: "continuous cool white light"
      experimental_context: "12 clusters with distinct decay profiles (20-139 members; 1,102 of 2,043 features clustered). Cluster 6 = shortest half-lives; cluster 11 = highly expressed genes with long half-lives; clusters 2 and 4 enriched in tRNA/rRNA/ncRNA features. Per-cluster narrative descriptions not extracted yet — functional_description is null initially."
      experiments:
        - rifampicin_rna_decay_med4
