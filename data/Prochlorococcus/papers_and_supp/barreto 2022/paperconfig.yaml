    coculture_prochlorococcus_mit9312_at_800_ez55_rnaseq:
      name: EZ55 Coculture with Prochlorococcus MIT9312 vs Mean Coculture Response across Three Partners at 800 ppm pCO2 (RNASEQ)
      organism: Alteromonas macleodii EZ55
      treatment_condition: Coculture with Prochlorococcus MIT9312 at 800 ppm pCO2
      control_condition: Mean coculture response across the three partners (MIT9312, CC9311, WH8102) at 800 ppm pCO2
      experimental_context: As presented by the paper (Fig. 2, Table S5), partner-specific deviation of EZ55 transcription
        from the mean coculture response across the three partners at elevated pCO2 (800 ppm), not a comparison with
        axenic EZ55; see the design_notes caveat. Artificial seawater with PEv nutrients for axenic EZ55 and MIT9312 cocultures, SEv nutrients for Synechococcus cocultures
      omics_type: RNASEQ
      test_type: edgeR
      treatment_type: [coculture]
      background_factors: [diel]
      medium: Artificial seawater with PEv nutrients for axenic EZ55 and MIT9312 cocultures, SEv nutrients for Synechococcus cocultures
      temperature: 21C
      light_condition: 14:10 light-dark cycle
      light_intensity: 150 umol photons m-2 s-1
      treatment_organism: Prochlorococcus MIT9312
      treatment_taxid: 74546
      treatment_assembly_accession: GCF_000012645.1
      table_scope: significant_only
      design_notes: >-
        The paper presents logFC as the partner deviation from the partner-averaged coculture response
        at 800 ppm (Fig. 2, Table S5), not
        partner vs axenic (adding the general coculture logFC of Table S5 recovers the vs-axenic value);
        the three partner tables at 800 ppm sum to zero per gene. Matched by growth state, not by
        sampling day: arms are acclimated cultures harvested in exponential growth; the axenic EZ55 and
        MIT9312 coculture libraries are from Hennon 2017, the Synechococcus cocultures were grown later. Caveat: the author script has no contrast for that quantity; Tables S12 to S14 more likely are
        its contrasts 7 to 9 (partner-specific pCO2 interaction minus the mean of the three, Methods item v).
        Their logFC runs opposite to the matching 400 ppm table on shared genes (r = -0.61, -0.83, -0.97
        for MIT9312, CC9311, WH8102).
        adjusted_p_value on these edges is the unadjusted p-value reported by the paper (no multiple-testing correction).
