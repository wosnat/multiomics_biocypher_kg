        the three partner tables at 800 ppm sum to zero per gene. Matched by growth state, not by
        sampling day: arms are acclimated cultures harvested in exponential growth; the axenic EZ55 and
        MIT9312 coculture libraries are from Hennon 2017, the Synechococcus cocultures were grown later. Caveat: the author script has no contrast for that quantity; Tables S12 to S14 more likely are
        its contrasts 7 to 9 (partner-specific pCO2 interaction minus the mean of the three, Methods item v).
        Their logFC runs opposite to the matching 400 ppm table on shared genes (r = -0.61, -0.83, -0.97
        for MIT9312, CC9311, WH8102).
        adjusted_p_value on these edges is the unadjusted p-value reported by the paper (no multiple-testing correction).
    interaction_pco2_coculture_ez55_rnaseq:
      name: EZ55 Table S4 contrast, labelled pCO2 x coculture interaction by the authors (RNASEQ)
      organism: Alteromonas macleodii EZ55
      treatment_condition: Mean of the three partner-specific pCO2 interaction coefficients (MIT9312, CC9311, WH8102)
      control_condition: Axenic EZ55 pCO2 coefficient (800 vs 400 ppm)
      experimental_context: Contrast 6 of the shared EZ55 edgeR GLM (design ~0+cyano+treatment+cyano:treatment), computed
        by the author script as the mean of the three cyano:treatment coefficients minus the axenic treatment
        coefficient. The paper labels it the pCO2 by coculture interaction (Table S4 legend). Artificial seawater with PEv nutrients for axenic EZ55 and MIT9312 cocultures, SEv nutrients for Synechococcus cocultures
      omics_type: RNASEQ
      test_type: edgeR
      treatment_type: [carbon]
      background_factors: [axenic, coculture, diel]
      background_organisms:
        - organism: "Prochlorococcus MIT9312"
          taxid: 74546
          assembly_accession: "GCF_000012645.1"
        - organism: "Synechococcus CC9311"
          taxid: 64471
          assembly_accession: "GCF_000014585.1"
        - organism: "Synechococcus WH8102"
          taxid: 84588
          assembly_accession: "GCF_000195975.1"
      medium: Artificial seawater with PEv nutrients for axenic EZ55 and MIT9312 cocultures, SEv nutrients for Synechococcus cocultures
      temperature: 21C
      light_condition: 14:10 light-dark cycle
      light_intensity: 150 umol photons m-2 s-1
      table_scope: significant_only
      design_notes: >-
        The author script defines this table as the mean of the three partner-specific pCO2 interaction
        coefficients minus the axenic pCO2 coefficient, not a clean interaction term; Table S5 also presents these values as the general
        coculture response at 800 ppm. Matched by growth state, not by sampling day: arms are acclimated
        cultures harvested in exponential growth; the axenic EZ55 and MIT9312 coculture libraries are
        from Hennon 2017, the Synechococcus cocultures were grown later. Because the interaction coefficients already
        measure the partner pCO2 response relative to axenic, subtracting the axenic coefficient again leaves a
        quantity the paper does not define; on the 115 genes shared with Table S2 the logFC is opposite in sign
        (r = -0.98).
        adjusted_p_value on these edges is the unadjusted p-value reported by the paper (no multiple-testing correction).
  supplementary_materials:
    id_translation_pro_9312:
      type: id_translation
      filename: data/Prochlorococcus/papers_and_supp/barreto 2022/pro_9312_anot_modified.csv
      organism: Prochlorococcus MIT9312
      id_columns:
      - column: GID
        id_type: old_locus_tag
      - column: SYMBOL
        id_type: gene_name
      - column: uniprot_acc
        id_type: uniprot_accession
      # _modified (2026-08-29): uniprot_acc blanked on rows where it disagrees with the
      # KG's UniProt join, or whose uniprot_def describes a neighbouring row's product
      # rather than its own (pro_9312: the column is shifted by one row in several
      # blocks, e.g. PMT9312_1637/rpsH carried Q318J8 = rplF). Kept rows are the paper's only accession anchor for
      # genes UniProt no longer lists for this taxid (groL1/groL2 -> CH601/CH602_PROM9).
      product_columns:
      - column: PRODUCT
    id_translation_syn_9311:
      type: id_translation
      filename: data/Prochlorococcus/papers_and_supp/barreto 2022/syn_9311.csv
      organism: Synechococcus CC9311
      id_columns:
      - column: GID
        id_type: locus_tag
      - column: genename
        id_type: gene_name
      # uniprot_acc not an id column: syn_9311.csv carries none of the KG's known accessions.
      product_columns:
