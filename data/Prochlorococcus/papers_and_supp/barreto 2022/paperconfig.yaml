publication:
  papername: Barreto 2022
  papermainpdf: data/Prochlorococcus/papers_and_supp/barreto 2022/43705_2022_article_197.pdf
  control_timing: matched
  experiments:
    carbon_stress_elevated_pco2_800_ppm_mit9312_rnaseq:
      name: MIT9312 Elevated pCO2 (800 ppm) vs Ambient pCO2 (400 ppm) (RNASEQ)
      organism: Prochlorococcus MIT9312
      treatment_condition: Elevated pCO2 (800 ppm)
      control_condition: Ambient pCO2 (400 ppm)
      experimental_context: In PEv medium (artificial seawater), in coculture with Alteromonas EZ55 (the cyanobacteria were grown only in coculture)
      omics_type: RNASEQ
      test_type: edgeR
      treatment_type: [carbon]
      background_factors: [coculture, diel]
      background_organisms:
        - organism: "Alteromonas macleodii EZ55"
          taxid: 28108
          assembly_accession: "GCF_901457815.2"
      medium: PEv medium (artificial seawater with PEv nutrients, as in Hennon 2017)
      temperature: 21C
      light_condition: 14:10 light-dark cycle
      light_intensity: 150 umol photons m-2 s-1
      table_scope: significant_only
      design_notes: >-
        Matched by growth state, not by sampling day: both pCO2 arms were acclimated for three transfer
        cycles and harvested in exponential growth in the final cycle (Methods p. 2). The MIT9312
        libraries are re-analysed from Hennon 2017. adjusted_p_value on these edges is the unadjusted p-value reported by the paper (no multiple-testing correction).
    carbon_stress_elevated_pco2_800_ppm_cc9311_rnaseq:
      name: CC9311 Elevated pCO2 (800 ppm) vs Ambient pCO2 (400 ppm) (RNASEQ)
