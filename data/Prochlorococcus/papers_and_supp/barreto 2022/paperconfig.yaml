      control_condition: Ambient pCO2 (400 ppm)
      experimental_context: Axenic Alteromonas EZ55 in PEv medium (artificial seawater); pCO2 coefficient for the
        axenic reference level of the shared EZ55 edgeR GLM (Table S2), not an average over coculture conditions
      omics_type: RNASEQ
      test_type: edgeR
      treatment_type: [carbon]
      background_factors: [axenic, diel]
      medium: PEv medium (artificial seawater with PEv nutrients, as in Hennon 2017)
      temperature: 21C
      light_condition: 14:10 light-dark cycle
      light_intensity: 150 umol photons m-2 s-1
      table_scope: significant_only
      design_notes: >-
        This table is the pCO2 effect in axenic EZ55 only (author script), not an average over coculture
        conditions. Matched by growth state, not by sampling day: arms are acclimated cultures harvested
        in exponential growth; the axenic EZ55 and MIT9312 coculture libraries are from Hennon 2017, the
        Synechococcus cocultures were grown later. adjusted_p_value on these edges is the unadjusted p-value reported by the paper (no multiple-testing correction).
    coculture_prochlorococcus_mit9312_at_400_ez55_rnaseq:
      name: EZ55 Coculture with Prochlorococcus MIT9312 vs Mean Coculture Response across Three Partners at 400 ppm pCO2 (RNASEQ)
      organism: Alteromonas macleodii EZ55
      treatment_condition: Coculture with Prochlorococcus MIT9312 at 400 ppm pCO2
      control_condition: Mean coculture response across the three partners (MIT9312, CC9311, WH8102) at 400 ppm pCO2
      experimental_context: Partner-specific deviation of EZ55 transcription from the mean coculture response
        across the three partners at ambient pCO2 (400 ppm), not a comparison with axenic EZ55. Artificial seawater with PEv nutrients for axenic EZ55 and MIT9312 cocultures, SEv nutrients for Synechococcus cocultures
      omics_type: RNASEQ
      test_type: edgeR
      treatment_type: [coculture]
      background_factors: [diel]
      medium: Artificial seawater with PEv nutrients for axenic EZ55 and MIT9312 cocultures, SEv nutrients for Synechococcus cocultures
      temperature: 21C
      light_condition: 14:10 light-dark cycle
      light_intensity: 150 umol photons m-2 s-1
      treatment_organism: Prochlorococcus MIT9312
      treatment_taxid: 74546
      treatment_assembly_accession: GCF_000012645.1
      table_scope: significant_only
      design_notes: >-
        logFC is the partner deviation from the partner-averaged coculture response at 400 ppm, not
        partner vs axenic (adding the general coculture logFC of Table S5 recovers the vs-axenic value);
        the three partner tables at 400 ppm sum to zero per gene. Matched by growth state, not by
