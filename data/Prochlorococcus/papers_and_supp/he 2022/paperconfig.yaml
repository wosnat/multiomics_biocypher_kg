publication:
  papername: He 2022
  papermainpdf: data/Prochlorococcus/papers_and_supp/he 2022/fmicb-13-1038136.pdf
  experiments:
    salt_low_salinity_acclimation_28_natl1a_rnaseq:
      name: NATL1A Low salinity acclimation (28 psu) vs Normal seawater salinity (34 psu) (RNASEQ)
      organism: Prochlorococcus NATL1A
      treatment_condition: Low salinity acclimation (28 psu)
      control_condition: Normal seawater salinity (34 psu)
      experimental_context: Axenic Prochlorococcus NATL1A in Pro99 medium at 21C under continuous light (10 uE m-2 s-1), acclimated
        through five rounds of transfer
      omics_type: RNASEQ
      test_type: DESeq
      treatment_type: [salt]
      background_factors: [axenic, light]
      medium: Pro99 natural seawater medium with reduced salinity
      temperature: 21C
      light_condition: continuous light
      light_intensity: 10 umol photons m-2 s-1
      table_scope: all_detected_genes
    salt_low_salinity_acclimation_28_med4_rnaseq:
      name: MED4 Low salinity acclimation (28 psu) vs Normal seawater salinity (34 psu) (RNASEQ)
      organism: Prochlorococcus MED4
      treatment_condition: Low salinity acclimation (28 psu)
      control_condition: Normal seawater salinity (34 psu)
      experimental_context: Axenic Prochlorococcus MED4 in Pro99 medium at 21C under continuous light (10 uE m-2 s-1), acclimated
        through five rounds of transfer
      omics_type: RNASEQ
      test_type: DESeq
      treatment_type: [salt]
      background_factors: [axenic, light]
      medium: Pro99 natural seawater medium with reduced salinity
      temperature: 21C
      light_condition: continuous light
      light_intensity: 10 umol photons m-2 s-1
      table_scope: all_detected_genes
  supplementary_materials:
    # Source: GEO GSE195946 (the study's own deposit) rather than the paper's
    # supplementary tables S1/S2. S1/S2 carry only the "highly differentially
    # expressed" genes (FDR <= 0.05 AND |logFC| > 1): 82 rows for NATL1A, 31 for
    # MED4. These files are the complete edgeR output for every detected gene
    # (2239 / 2042 rows) with a real FDR column, so the KG gets the full
    # detection background instead of a pre-filtered slice.
    #
    # Significance is now derived rather than asserted: prefiltered is false and
    # the adapter defaults (pvalue_threshold 0.05, logfc_threshold 1.0, both set
    # explicitly below) reproduce the authors' own selection -- 81 NATL1A and 30
    # MED4 genes come out significant, against the 82 / 31 rows S1/S2 listed.
    #
    # GeneID is 'gene-<locus_tag>' and hits specific_lookup directly
    # (gene-NATL1_00011 -> NATL1_00011, gene-PMM0087 -> PMM0087), so no bridge
    # column is needed. See geo_source.txt.
    geo_de_natl1a:
      type: csv
      filename: data/Prochlorococcus/papers_and_supp/he 2022/GSE195946_Group_NATL1A-34-VS-NATL1A-28_DE_anno.txt
      organism: Prochlorococcus NATL1A
      sep: "\t"
      id_columns:
        - column: GeneID
          id_type: locus_tag
      product_columns:
      - column: Product
      statistical_analyses:
      - id: DE_low_salinity_vs_normal_NATL1A
        experiment: salt_low_salinity_acclimation_28_natl1a_rnaseq
        timepoint: acclimated
        timepoint_hours: null
        growth_phase: acclimated_steady_state
        name_col: GeneID
        logfc_col: logFC
        adjusted_p_value_col: FDR
        pvalue_threshold: 0.05
        logfc_threshold: 1.0
        prefiltered: false
    geo_de_med4:
      type: csv
      filename: data/Prochlorococcus/papers_and_supp/he 2022/GSE195946_Group_MED4-34-VS-MED4-28_DE_anno.txt
      organism: Prochlorococcus MED4
      sep: "\t"
      id_columns:
        - column: GeneID
          id_type: locus_tag
      product_columns:
      - column: Product
      statistical_analyses:
      - id: DE_low_salinity_vs_normal_MED4
        experiment: salt_low_salinity_acclimation_28_med4_rnaseq
        timepoint: acclimated
        timepoint_hours: null
        growth_phase: acclimated_steady_state
        name_col: GeneID
        logfc_col: logFC
        adjusted_p_value_col: FDR
        pvalue_threshold: 0.05
        logfc_threshold: 1.0
        prefiltered: false
