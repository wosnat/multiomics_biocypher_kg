publication:
  papername: Weissberg 2025
  papermainpdf: data/Prochlorococcus/papers_and_supp/Weissberg_2025/cc1a3_bioax_2025.pdf
  control_timing: baseline
  experiments:
    growth_state_pro99lown_nutrient_starvation_hot1a3_rnaseq_axenic:
      name: HOT1A3 axenic, PRO99-lowN nutrient starvation vs PRO99-lowN day 11 (RNASEQ)
      organism: Alteromonas macleodii HOT1A3
      treatment_condition: PRO99-lowN nutrient starvation
      control_condition: PRO99-lowN day 11
      experimental_context: Axenic Alteromonas HOT1A3 in PRO99-lowN at 24C under continuous light
      omics_type: RNASEQ
      test_type: DESeq2
      treatment_type: [nitrogen]
      background_factors: [axenic, light]
      medium: PRO99-lowN
      temperature: 24C
      light_condition: continuous light
      light_intensity: 20 umol photons m-2 s-1
      table_scope: all_detected_genes
      design_notes: >-
        day 18 and day 31: axenic HOT1A3 vs the same axenic series sampled on day 11 (nutrient_limited,
        Alteromonas declines from the start and has no exponential phase in this medium). No axenic
        HOT1A3 RNA exists after day 31.
    growth_state_pro99lown_nutrient_starvation_hot1a3_rnaseq_coculture:
      name: HOT1A3 in coculture with MED4, PRO99-lowN nutrient starvation vs PRO99-lowN day 11 (RNASEQ)
      organism: Alteromonas macleodii HOT1A3
      treatment_condition: PRO99-lowN nutrient starvation
      control_condition: PRO99-lowN day 11
      experimental_context: Alteromonas HOT1A3 in coculture with Prochlorococcus MED4 in PRO99-lowN at 24C under continuous
        light
      omics_type: RNASEQ
      test_type: DESeq2
      treatment_type: [nitrogen]
      background_factors: [coculture, light]
      background_organisms:
        - organism: "Prochlorococcus MED4"
          taxid: 59919
          assembly_accession: "GCF_000011465.1"
      medium: PRO99-lowN
      temperature: 24C
      light_condition: continuous light
      light_intensity: 20 umol photons m-2 s-1
      table_scope: all_detected_genes
      design_notes: >-
        Each timepoint (day 18, day 31, day 60, day 89) is coculture HOT1A3 vs the same coculture series
        sampled on day 11 (nutrient_limited, Alteromonas has no exponential phase in this medium). days
        60+89 pools the day 60 and day 89 samples.
    coculture_prochlorococcus_med4_hot1a3_rnaseq:
      name: HOT1A3 Coculture with Prochlorococcus MED4 vs Axenic (RNASEQ)
      organism: Alteromonas macleodii HOT1A3
      treatment_condition: Coculture with Prochlorococcus MED4
      control_condition: Axenic
      experimental_context: Days 11, 18, and 31 in PRO99-lowN at 24C under continuous light
      omics_type: RNASEQ
      test_type: DESeq2
      treatment_type: [coculture]
      background_factors: ["light"]
      medium: PRO99-lowN
      temperature: 24C
      light_condition: continuous light
      light_intensity: 20 umol photons m-2 s-1
      treatment_organism: Prochlorococcus MED4
      treatment_taxid: 59919
      treatment_assembly_accession: GCF_000011465.1
      table_scope: all_detected_genes
      control_timing: matched
      design_notes: >-
        Coculture vs axenic HOT1A3 with both arms sampled on the same day (day 11, day 18, day 31) of
        the same experiment run.
    growth_state_pro99lown_nutrient_starvation_hot1a3_proteomics_axenic:
      name: HOT1A3 axenic, PRO99-lowN nutrient starvation vs PRO99-lowN day 11 (PROTEOMICS)
      organism: Alteromonas macleodii HOT1A3
      treatment_condition: PRO99-lowN nutrient starvation
      control_condition: PRO99-lowN day 11
      experimental_context: Axenic Alteromonas HOT1A3 in PRO99-lowN at 24C under continuous light
      omics_type: PROTEOMICS
      test_type: DEqMS
      treatment_type: [nitrogen]
      background_factors: [axenic, light]
      medium: PRO99-lowN
      temperature: 24C
      light_condition: continuous light
      light_intensity: 20 umol photons m-2 s-1
      table_scope: all_detected_genes
      design_notes: >-
        day 18, day 31 and day 89: axenic HOT1A3 vs the same axenic series sampled on day 11
        (nutrient_limited, Alteromonas has no exponential phase in this medium).
    growth_state_pro99lown_nutrient_starvation_hot1a3_proteomics_coculture:
      name: HOT1A3 in coculture with MED4, PRO99-lowN nutrient starvation vs PRO99-lowN day 11 (PROTEOMICS)
      organism: Alteromonas macleodii HOT1A3
      treatment_condition: PRO99-lowN nutrient starvation
      control_condition: PRO99-lowN day 11
      experimental_context: Alteromonas HOT1A3 in coculture with Prochlorococcus MED4 in PRO99-lowN at 24C under continuous
        light
      omics_type: PROTEOMICS
      test_type: DEqMS
      treatment_type: [nitrogen]
      background_factors: [coculture, light]
      background_organisms:
        - organism: "Prochlorococcus MED4"
          taxid: 59919
          assembly_accession: "GCF_000011465.1"
      medium: PRO99-lowN
      temperature: 24C
      light_condition: continuous light
      light_intensity: 20 umol photons m-2 s-1
      table_scope: all_detected_genes
      design_notes: >-
        Each timepoint (day 18, day 31, day 60, day 89, days 60+89) is coculture HOT1A3 vs the same
        coculture series sampled on day 11 (nutrient_limited, Alteromonas has no exponential phase in
        this medium). days 60+89 pools the day 60 and day 89 samples.
    growth_state_pro99lown_nutrient_starvation_med4_rnaseq_axenic:
      name: MED4 axenic, PRO99-lowN nutrient starvation vs PRO99-lowN exponential growth (RNASEQ)
      organism: Prochlorococcus MED4
      treatment_condition: PRO99-lowN nutrient starvation
      control_condition: PRO99-lowN exponential growth
      experimental_context: Axenic Prochlorococcus MED4 in PRO99-lowN at 24C under continuous light
      omics_type: RNASEQ
      test_type: DESeq2
      treatment_type: [nitrogen]
      background_factors: [axenic, light]
      medium: PRO99-lowN
      temperature: 24C
      light_condition: continuous light
      light_intensity: 20 umol photons m-2 s-1
      table_scope: all_detected_genes
      design_notes: >-
        day 14: axenic MED4 vs the same axenic series sampled on day 7 (exponential); axenic MED4 was a
        separate repeat experiment sampled on days 7 and 14. No axenic MED4 RNA exists after day 14.
    growth_state_pro99lown_nutrient_starvation_med4_rnaseq_coculture:
      name: MED4 in coculture with HOT1A3, PRO99-lowN nutrient starvation vs PRO99-lowN exponential growth (RNASEQ)
      organism: Prochlorococcus MED4
      treatment_condition: PRO99-lowN nutrient starvation
      control_condition: PRO99-lowN exponential growth
      experimental_context: Prochlorococcus MED4 in coculture with Alteromonas HOT1A3 in PRO99-lowN at 24C under continuous
        light
      omics_type: RNASEQ
      test_type: DESeq2
      treatment_type: [nitrogen]
      background_factors: [coculture, light]
      background_organisms:
        - organism: "Alteromonas macleodii HOT1A3"
          taxid: 28108
          assembly_accession: "GCF_001578515.1"
      medium: PRO99-lowN
      temperature: 24C
      light_condition: continuous light
      light_intensity: 20 umol photons m-2 s-1
      table_scope: all_detected_genes
      design_notes: >-
        Each timepoint (day 18, day 31, day 60, day 89) is coculture MED4 vs the same coculture series
        sampled on day 11 (exponential). days 60+89 pools the day 60 and day 89 samples.
    coculture_alteromonas_hot1a3_med4_rnaseq:
      name: MED4 Coculture with Alteromonas HOT1A3 vs Axenic (RNASEQ)
      organism: Prochlorococcus MED4
      treatment_condition: Coculture with Alteromonas HOT1A3
      control_condition: Axenic
      experimental_context: Log exponential day 11 and day 18 in PRO99-lowN at 24C under continuous light
      omics_type: RNASEQ
      test_type: DESeq2
      treatment_type: [coculture]
      background_factors: ["light"]
      medium: PRO99-lowN
      temperature: 24C
      light_condition: continuous light
      light_intensity: 20 umol photons m-2 s-1
      treatment_organism: Alteromonas macleodii HOT1A3
      treatment_taxid: 28108
      treatment_assembly_accession: GCF_001578515.1
      table_scope: all_detected_genes
      control_timing: matched
      design_notes: >-
        Matched by growth state, not by sampling day: the axenic MED4 control came from a separate
        repeat experiment sampled on days 7 and 14 to match axenic MED4 growth dynamics (Methods p. 14).
        day 11: coculture day 11 vs axenic day 7 (both exponential). day 18: coculture day 18 vs axenic
        day 14 (death, axenic MED4 lost viability around day 11).
    growth_state_pro99lown_nutrient_starvation_med4_proteomics_axenic:
      name: MED4 axenic, PRO99-lowN nutrient starvation vs PRO99-lowN exponential growth (PROTEOMICS)
      organism: Prochlorococcus MED4
      treatment_condition: PRO99-lowN nutrient starvation
      control_condition: PRO99-lowN exponential growth
      experimental_context: Axenic Prochlorococcus MED4 in PRO99-lowN at 24C under continuous light
      omics_type: PROTEOMICS
      test_type: DEqMS
      treatment_type: [nitrogen]
      background_factors: [axenic, light]
      medium: PRO99-lowN
      temperature: 24C
      light_condition: continuous light
      light_intensity: 20 umol photons m-2 s-1
      table_scope: all_detected_genes
      design_notes: >-
        day 14, day 31 and day 89: axenic MED4 vs axenic MED4 sampled on day 7 (exponential). Day 7 and
        day 14 come from the axenic repeat experiment; the methods do not say which run day 31 and day
        89 came from.
    growth_state_pro99lown_nutrient_starvation_med4_proteomics_coculture:
      name: MED4 in coculture with HOT1A3, PRO99-lowN nutrient starvation vs PRO99-lowN exponential growth (PROTEOMICS)
      organism: Prochlorococcus MED4
      treatment_condition: PRO99-lowN nutrient starvation
      control_condition: PRO99-lowN exponential growth
      experimental_context: Prochlorococcus MED4 in coculture with Alteromonas HOT1A3 in PRO99-lowN at 24C under continuous
        light
      omics_type: PROTEOMICS
      test_type: DEqMS
      treatment_type: [nitrogen]
      background_factors: [coculture, light]
      background_organisms:
        - organism: "Alteromonas macleodii HOT1A3"
          taxid: 28108
          assembly_accession: "GCF_001578515.1"
      medium: PRO99-lowN
      temperature: 24C
      light_condition: continuous light
      light_intensity: 20 umol photons m-2 s-1
      table_scope: all_detected_genes
      design_notes: >-
        Each timepoint (day 18, day 31, day 60, day 89, days 60+89) is coculture MED4 vs the same
        coculture series sampled on day 11 (exponential). days 60+89 pools the day 60 and day 89
        samples.
