# Catch-all / no-content-bearing terms across ontology sources.
#
# Guiding principle: if the term tells the consumer the broad CLASS
# (transporter, enzyme, peptidase, two-component system) — even if a sub-class
# dimension is unknown — treat the term as INFORMATIVE. Only flag terms that
# convey no class signal at all.
#
# Pfam DUF/UPF stay UN-flagged (recognized structural domain = informative).
# COG R ('General function prediction only') stays UN-flagged (borderline).
# All BRITE entries stay UN-flagged (every entry sits inside a class-bearing tree).

biological_process:
  ids:
    - go:0008150          # biological_process root

molecular_function:
  ids:
    - go:0003674          # molecular_function root

cellular_component:
  ids:
    - go:0005575          # cellular_component root

cog_category:
  ids:
    - cog.category:S      # Function unknown

cyanorak_role:
  ids:
    - cyanorak.role:R     # Other (parent — used standalone = no class info)
    - cyanorak.role:R.1   # Other > Conserved hypothetical domains
    - cyanorak.role:R.2   # Other > Conserved hypothetical proteins
    - cyanorak.role:R.4   # Other > Hypothetical proteins
    - cyanorak.role:R.5   # Other > Other
  # Q.9 (Transport > Unknown substrate) and R.3 (Other > Enzymes of unknown
  # specificity) intentionally NOT flagged — class is known.

tigr_role:
  ids:
    - tigr.role:156       # Hypothetical proteins / Conserved
    - tigr.role:704       # Hypothetical proteins / Domain
    - tigr.role:856       # Not Found
    - tigr.role:270       # Disrupted reading frame / (Cyanorak-only root)
    - tigr.role:185       # Unclassified / Role category not yet assigned
    - tigr.role:157       # Unknown function / General
    - tigr.role:hypothetical_proteins   # mainrole (level 0) — 2026-08-29 hierarchy
    - tigr.role:unknown_function        # mainrole
    - tigr.role:unclassified            # mainrole
  # 141 (Transport / Unknown substrate) and 703 (Unknown function / Enzymes
  # of unknown specificity) intentionally NOT flagged — class is known.
  # 856 "Not Found" and 270 "Disrupted reading frame /" are themselves roots
  # (no ' / '-separated subrole), already listed above.

kegg_term:
  # ~210 KOs match this pattern; ID list omitted (too many; pattern stable).
  name_patterns:
    - '^K\d+;\s+uncharacterized protein\b'
  # KEGG global / overview maps (DOC-002, 2026-08-29): unions of other pathways
  # (ko01100 "Metabolic pathways" rolls up 27K genes), the standard KEGG-ORA
  # exclusion. Parentless level-2 nodes in the KG — no "Global and overview
  # maps" subcategory node exists — so an explicit id list. Enumerate live with
  #   MATCH (p:KeggTerm {level_kind:'pathway'})
  #   WHERE NOT (p)-[:Kegg_term_is_a_kegg_term]->() RETURN p.id
  # category / subcategory nodes (6 + 46) stay UN-flagged: "Carbohydrate
  # metabolism" is a class signal; gate them with `level`, not this flag.
  # ko01310 "Nitrogen cycle" (16 KOs, a strict subset of ko00910) and ko01320
  # "Sulfur cycle" (22 KOs) are ALSO parentless overview maps but are narrow,
  # class-bearing subsets, not unions — deliberately NOT flagged (11 of 13).
  ids:
    - kegg.pathway:ko01100   # Metabolic pathways
    - kegg.pathway:ko01110   # Biosynthesis of secondary metabolites
    - kegg.pathway:ko01120   # Microbial metabolism in diverse environments
    - kegg.pathway:ko01200   # Carbon metabolism
    - kegg.pathway:ko01210   # 2-Oxocarboxylic acid metabolism
    - kegg.pathway:ko01212   # Fatty acid metabolism
    - kegg.pathway:ko01220   # Degradation of aromatic compounds
    - kegg.pathway:ko01230   # Biosynthesis of amino acids
    - kegg.pathway:ko01232   # Nucleotide metabolism
    - kegg.pathway:ko01240   # Biosynthesis of cofactors
    - kegg.pathway:ko01250   # Biosynthesis of nucleotide sugars

interpro_entry:
  # Mirrored in post-import Cypher F1.1 (name-pattern rule, KEGG-KO precedent).
  name_patterns:
    - '^Protein of unknown function'
    - '^Domain of unknown function'
    - '^Uncharacterised protein family'
    - '^Uncharacterized protein family'

ncbifam:
  # THIRD RULE KIND (spec 2026-08-17 §5.5): property-valued — flags by
  # family_type, not id/name. hypoth_equivalog = "conserved family of unknown
  # function" (126 observed nodes, ~2.5%). Name-pattern fallback included.
  family_types:
    - hypoth_equivalog
    - hypoth_equivalog_domain
  name_patterns:
    - '(?i)hypothetical'
    - '(?i)uncharacterized'
    - '\bDUF\d'

# ec_number: section omitted — every EC is functionally specific.
# brite_category: section omitted — every BRITE entry sits inside a
#   class-bearing tree (Transporters, Peptidases, Two-component, etc.);
#   no entries pass the 'no class signal' bar.
# pfam: section omitted — DUF/UPF stay informative-shaped per anti-scope.
# pfam_clan: section omitted — clans are structural superfamilies.
