# TCDB substrate target filter: ChEBI ids dropped from Tcdb_family_transports_metabolite
# (prepare_data step 6). Same format and meaning as go_transport_target_filter.yaml, whose 13
# targets are repeated here (protein excepted, removed from both) so TCDB and GO answer "what moves X" on the same terms, plus the
# placeholders TCDB curates that name no substrate. Matched on canonical node ids, after
# resolution, so any ChEBI id that lands on one of these nodes is dropped too. The canonical ids
# are published as Schema_info.tcdb_substrate_excluded_targets: an empty TCDB answer for them is
# curation, not biology.
# Source: 2026-10-24 TCDB integration review (decisions: coupling ions and placeholders dropped;
# protein kept on 2026-10-25 — it is the real substrate of Sec / Tat / secretion systems, in both filters).
targets:
  # ── shared with the GO transport filter ──────────────────────────────────
  - chebi: "CHEBI:24870"
    name: "ion"
    reason: "upper-level ChEBI class - transporter-ness, not a substrate"
  - chebi: "CHEBI:24867"
    name: "monoatomic ion"
    reason: "upper-level ChEBI class - transporter-ness, not a substrate"
  - chebi: "CHEBI:23906"
    name: "monoatomic cation"
    reason: "upper-level ChEBI class - transporter-ness, not a substrate"
  - chebi: "CHEBI:23905"
    name: "monoatomic anion"
    reason: "upper-level ChEBI class - transporter-ness, not a substrate"
  - chebi: "CHEBI:25213"
    name: "metal cation"
    reason: "upper-level ChEBI class - transporter-ness, not a substrate"
  - chebi: "CHEBI:33515"
    name: "transition element cation"
    reason: "upper-level ChEBI class - transporter-ness, not a substrate"
  - chebi: "CHEBI:51143"
    name: "nitrogen molecular entity"
    reason: "upper-level ChEBI class - transporter-ness, not a substrate"
  - chebi: "CHEBI:33694"
    name: "biomacromolecule"
    reason: "upper-level ChEBI class - transporter-ness, not a substrate"
  - chebi: "CHEBI:24431"
    name: "chemical entity"
    reason: "upper-level ChEBI class - transporter-ness, not a substrate"
  - chebi: "CHEBI:24834"
    name: "inorganic anion"
    reason: "upper-level ChEBI class - transporter-ness, not a substrate"
  - chebi: "CHEBI:15378"
    name: "hydron"
    reason: "coupling ion / bioenergetics, not the transported substrate"
  - chebi: "CHEBI:29101"
    name: "sodium(1+)"
    reason: "coupling ion / bioenergetics, not the transported substrate"
  # ── TCDB placeholders ─────────────────────────────────────────────────────
  - chebi: "CHEBI:25367"
    name: "molecule"
    reason: "placeholder - names no substrate (655 kept systems)"
  - chebi: "CHEBI:36916"
    name: "cation"
    reason: "placeholder - names no substrate"
  - chebi: "CHEBI:22563"
    name: "anion"
    reason: "placeholder - names no substrate"
  - chebi: "CHEBI:36915"
    name: "inorganic cation"
    reason: "placeholder - names no substrate"
  - chebi: "CHEBI:25414"
    name: "monoatomic monocation"
    reason: "placeholder - names no substrate"
  - chebi: "CHEBI:25696"
    name: "organic anion"
    reason: "placeholder - names no substrate"
