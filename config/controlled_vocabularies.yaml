  value_type: string_array
  closed: true
  values: [axenic, light, diel, coculture, chemical, darkness, viral]
  min_size: 1
  description: >
    DENSE and NON-EMPTY (min_size 1) on every Experiment — an experiment
    always has a held-constant context. neo4j-admin import drops an empty
    string[] cell, so post-import re-materializes [] on the denormalized
    labels (ClusteringAnalysis may legitimately be [] — Hackl 2023 genomic
    islands have no experimental context). Harvested from CLAUDE.md's
    "background_factors canonical values" bullet. Since 2026-08-27
    scripts/validate_paperconfig.py loads THIS list
    (CANONICAL_BACKGROUND_FACTORS) instead of a shared set, closing the old
    FINDING that the validator accepted treatment-only values here.

