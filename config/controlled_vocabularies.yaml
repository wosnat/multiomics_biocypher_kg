  #   verbatim to VALID_TYPES — the two are the same set, no reconciliation needed. Shipped as
  #   UPPERCASE_SNAKE_CASE (pre-existing convention; not lowercased per the vocabulary-contract's
  #   no-rename rule for released values).
  applies_to: Experiment
  applies_to_kind: node
  property: omics_type
  value_type: string
  closed: true
  values: [RNASEQ, MICROARRAY, PROTEOMICS, EXOPROTEOMICS, VESICLE_PROTEOMICS,
           METABOLOMICS, PAIRED_RNASEQ_PROTEOME, DNASEQ, VESICLE_DNASEQ,
           BIOINFORMATIC]
  description: >
    Omics modality of the experiment (RNASEQ, PROTEOMICS, MICROARRAY,
    METABOLOMICS, EXOPROTEOMICS, ...). BIOINFORMATIC = computed from genome
    sequence or annotation, with no sample (e.g. Ford 2021 predicted
    substrate-binding proteins). Upper-case snake_case by long-standing
    convention.

Experiment.compartment:
  # provenance (moved out of the researcher-facing description, 2026-08-29):
  #   COMPARTMENTS in multiomics_kg/vocab/non_de_evidence.py (validator + adapters
  #   import it). spent_medium and lysate were declared until 2026-08-29 but never
  #   emitted on any label (DOC-004) — pruned; re-add when a paper needs them.
  applies_to: Experiment
  applies_to_kind: node
  property: compartment
  value_type: string
  closed: true
  values: [whole_cell, vesicle, exoproteome, extracellular]
  description: >
    Subcellular fraction this experiment measured; default whole_cell.
    exoproteome is the proteomics term for secreted proteins recovered from
    the medium; extracellular is the general outside-the-cell pool used by
    metabolomics; vesicle is the extracellular-vesicle fraction.
  value_descriptions:
    whole_cell: intracellular / whole-cell fraction (the default)
    vesicle: extracellular-vesicle fraction
    exoproteome: secreted proteins recovered from the culture medium (proteomics convention)
    extracellular: general outside-the-cell pool, used by metabolomics

Experiment.table_scope:
  # provenance (moved out of the researcher-facing description, 2026-08-29):
  #   What genes the source DE table contains. No controlled-list constant exists in code (the
  #   adapter passes the paperconfig value through unvalidated) — harvested from CLAUDE.md "Key
  #   graph facts" per the controller ruling designating CLAUDE.md as authority here.
  applies_to: Experiment
  applies_to_kind: node
  property: table_scope
  value_type: string
  closed: true
  values: [all_detected_genes, significant_any_timepoint, significant_only,
           top_n, filtered_subset]
  description: >
    What genes the source differential-expression table contains:
    all_detected_genes, significant_any_timepoint, significant_only, top_n, or
    filtered_subset. Absent on experiments with no DE table (metabolomics /
    derived-metric-only). Read it before treating a table as a genome-wide
    background.
  value_descriptions:
    all_detected_genes: every gene detected in the experiment, significant or not; a usable genome-wide background
    significant_any_timepoint: genes significant at one or more time points, reported at every time point; not a background
    significant_only: only genes passing the significance threshold; not a background
    top_n: a fixed-size list of the strongest responders; not a background
    filtered_subset: a subset chosen by the authors on other criteria (see table_scope_detail); not a background

Experiment.control_timing:
  # provenance: curated per paperconfig (plans/per_arm_sampling_and_shared_model.md, 2026-10-15;
  #   curation log plans/control_timing_curation.md). Required on every experiment that has >=1
  #   statistical_analyses entry: a paper-level default (publication.control_timing) that each
  #   experiment may override, so every value is a curator claim, never an adapter default
  #   (explorer T1). Absent on experiments with no DE contrast, like table_scope. baseline and
  #   mixed require design_notes; mixed requires >=2 timepoints (validator). matched was
  #   time_matched until 2026-10-18, renamed so it does not imply the same clock time: it covers
  #   arms matched by sampling time or by growth state (curation review R1).
  applies_to: Experiment
  applies_to_kind: node
  property: control_timing
  value_type: string
  closed: true
  sparse: true
  values: [matched, baseline, mixed]
  description: >
    Whether the control arm of each contrast was matched to the treatment arm,
    by sampling time or by growth state. time_point and growth_phase always
    describe the treatment arm, so on a baseline or mixed experiment they say
    nothing about when or in what state the control was sampled; design_notes
    does, and on a matched experiment it says how the arms were matched when
    it was not the same sampling time. Absent on experiments with no
    differential-expression contrast.
  value_descriptions:
    matched: every contrast compares treatment and control arms sampled at the same time or in the same growth state, such as parallel cultures or successive steady states
    baseline: every contrast compares against a control sampled at another time, typically a single early reference point; read design_notes
    mixed: some timepoints are matched and others compare against a control sampled at another time; read design_notes for which

