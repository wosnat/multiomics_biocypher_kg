  value_descriptions:
    as_reported: the paper named the form, or the metabolite has no stereo variant other than anomers
    dominant_form_assumed: the name in the paper gives no stereo form, but the metabolite node is one specific stereo form, chosen either as the dominant form of its stereo family (the one with the most catalysing genes) or by a plain name match; treat the form as an assumption

Assay_flags_metabolite.stereo_assignment:
  applies_to: Assay_flags_metabolite
  applies_to_kind: edge
  property: stereo_assignment
  value_type: string
  closed: true
  values: [as_reported, dominant_form_assumed]
  description: >
    Whether the stereo form of the measured metabolite was stated by the paper
    or chosen by the KG.
  value_descriptions:
    as_reported: the paper named the form, or the metabolite has no stereo variant other than anomers
    dominant_form_assumed: the name in the paper gives no stereo form, but the metabolite node is one specific stereo form, chosen either as the dominant form of its stereo family (the one with the most catalysing genes) or by a plain name match; treat the form as an assumption

Gene.coordinate_source:
  # provenance: set in build_gene_mapping.py (step 0 sub-step 5). 'cyanorak' = PGAP
  #   never called the gene; its contig + contig-relative coordinates were recovered
  #   by inverting Cyanorak's contig tiling (NCBI contigs in accession order, 50 bp
  #   spacer). 3,837 genes over 21 strains on 2026-10-13.
  applies_to: Gene
  applies_to_kind: node
  property: coordinate_source
  value_type: string
  closed: true
  values: [ncbi, cyanorak]
  description: >
    Which annotation placed the contig, start, end and strand of this gene. ncbi =
    the RefSeq/PGAP call. cyanorak = NCBI never annotated this gene; the
    coordinates are a Cyanorak call, mapped onto the NCBI contig. Dense on
    every gene with coordinates.

Gene.sequence_source:
  # provenance: set in cyanorak_ncbi_adapter._get_gene_nodes. 'cyanorak' = no RefSeq
  #   protein_id to join protein.faa on; the Cyanorak GFF translation attribute is
  #   used instead (stop glyph stripped, first residue normalised to M as NCBI does).
  applies_to: Gene
  applies_to_kind: node
  property: sequence_source
  value_type: string
  closed: true
  sparse: true
  values: [ncbi, cyanorak]
  description: >
    Where the amino-acid sequence came from. ncbi = the RefSeq protein record.
    cyanorak = NCBI has no protein for this gene; the sequence is the Cyanorak translation of its own gene call. SPARSE — present exactly when sequence is.

# ── InterPro ────────────────────────────────────────────────────────────────
InterproEntry.interpro_type:
  # provenance (moved out of the researcher-facing description, 2026-08-29):
  #   InterPro entry class. PRIMARY stratification key for ORA over InterPro — breadth varies by
  #   type far more than by level. Preserved in InterPro's own UPPERCASE casing (not lowercased
  #   per house rule R1) because this is InterPro's own controlled vocabulary term, kept verbatim
  #   so it stays directly comparable to the source.
  applies_to: InterproEntry
  applies_to_kind: node
  property: interpro_type
  value_type: string
  closed: true
  values: [FAMILY, DOMAIN, HOMOLOGOUS_SUPERFAMILY, REPEAT, CONSERVED_SITE,
           ACTIVE_SITE, BINDING_SITE, PTM]
  description: >
    InterPro entry class (FAMILY, DOMAIN, HOMOLOGOUS_SUPERFAMILY,
    CONSERVED_SITE, ACTIVE_SITE, REPEAT, BINDING_SITE, PTM). The primary
    stratification key for enrichment over InterPro: entry breadth varies far
    more by type than by hierarchy level. the upper-case terms of InterPro,
    kept verbatim.

InterproEntry.level_kind:
  applies_to: InterproEntry
  applies_to_kind: node
  property: level_kind
  value_type: string
  closed: true
  values: []
  expected_empty: true
  description: >
    InterPro depth tiers have no natural names. Emit null. Stratify ORA by
    (interpro_type, level) — interpro_type primary, level secondary.

Gene_has_interpro_entry.libraries:
  # provenance (moved out of the researcher-facing description, 2026-08-29):
  #   InterProScan member databases that produced a match for this entry. The member-DB
  #   granularity of the signature-vs-inferred distinction — 'PFAM' means a direct HMM hit.
  #   Preserved in InterProScan's own UPPERCASE casing (not lowercased per house rule R1) because
  #   these are InterProScan's own controlled vocabulary terms, kept verbatim so they stay
  #   directly comparable to the source.
  applies_to: Gene_has_interpro_entry
  applies_to_kind: edge
  property: libraries
  value_type: string_array
  closed: true
  values: [CDD, GENE3D, HAMAP, NCBIFAM, PANTHER, PFAM, PIRSF, PRINTS,
