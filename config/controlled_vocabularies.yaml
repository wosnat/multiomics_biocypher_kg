Gene_has_tcdb_family.qcov:
  applies_to: Gene_has_tcdb_family
  applies_to_kind: edge
  property: qcov
  value_type: float
  closed: false
  values: []
  sparse: true
  min_value: 0.0
  max_value: 100.0
  description: >
    Query (gene protein) coverage of the alignment, percent 0-100; same hit
    as identity. Present on diamond edges only (absent on eggnog edges).

Gene_has_tcdb_family.evalue:
  applies_to: Gene_has_tcdb_family
  applies_to_kind: edge
  property: evalue
  value_type: float
  closed: false
  values: []
  sparse: true
  min_value: 0.0
  description: >
    blastp e-value of the alignment; same hit as identity. Present on diamond
    edges only (absent on eggnog edges).

Gene_has_merops_family.confidence_score:
  # provenance (moved out of the researcher-facing description, 2026-08-29):
  #   merops-diamond native per-call confidence in [0,1] (NOT the R4 evidence_score; tool-internal
  #   scale, never compared across ontologies). Dense — every edge is diamond-sourced.
  applies_to: Gene_has_merops_family
  applies_to_kind: edge
  property: confidence_score
  value_type: float
  closed: false
  values: []
  min_value: 0.0
  max_value: 1.0
  description: >
    the per-call confidence reported by merops-diamond in [0,1] — a tool-internal scale,
    not the cross-ontology evidence_score. Present on every edge (all are
    diamond-sourced).

Gene_has_merops_family.identity:
  applies_to: Gene_has_merops_family
  applies_to_kind: edge
  property: identity
  value_type: float
  closed: false
  values: []
  min_value: 0.0
  max_value: 100.0
  description: >
    blastp percent identity of the consensus best hit (0-100). Dense — every edge is diamond-sourced.

Gene_has_merops_family.qcov:
  applies_to: Gene_has_merops_family
  applies_to_kind: edge
  property: qcov
  value_type: float
  closed: false
  values: []
  min_value: 0.0
  max_value: 100.0
  description: >
    Query (gene protein) coverage of the consensus best hit, percent 0-100; same hit as identity. Dense — every edge is diamond-sourced.

Gene_has_merops_family.evalue:
  applies_to: Gene_has_merops_family
  applies_to_kind: edge
  property: evalue
  value_type: float
  closed: false
  values: []
  min_value: 0.0
  description: >
    blastp e-value of the best hit. Dense — every edge is diamond-sourced.

Gene_has_merops_family.consensus_n:
  applies_to: Gene_has_merops_family
  applies_to_kind: edge
  property: consensus_n
  value_type: int
  closed: false
  values: []
  min_value: 1
  description: >
    Number of hits agreeing on this call after consensus collapse. Dense — every edge is diamond-sourced.

Gene_has_subcellular_localization.score:
  applies_to: Gene_has_subcellular_localization
  applies_to_kind: edge
  property: score
  value_type: float
  closed: false
  values: []
  min_value: 0.0
  max_value: 10.0
  description: >
    PSORTb v3 localization confidence (≈7.5-10.0 on confident calls; the
    Unknown sentinel is never emitted). Dense. Post-import rank_by_score ranks
    within each localization.

Gene_has_signal_peptide_type.probability:
  applies_to: Gene_has_signal_peptide_type
  applies_to_kind: edge
  property: probability
  value_type: float
  closed: false
  values: []
  min_value: 0.0
  max_value: 1.0
  description: >
    SignalP 6 winning-class likelihood in [0,1]. Dense.

Gene_has_signal_peptide_type.cleavage_site:
  applies_to: Gene_has_signal_peptide_type
  applies_to_kind: edge
  property: cleavage_site
  value_type: int
  closed: false
  values: []
  sparse: true
  min_value: 1
  description: >
    Residue index before the predicted cut; SPARSE — absent when no cleavage
    site was predicted.

Gene_has_signal_peptide_type.cleavage_probability:
  applies_to: Gene_has_signal_peptide_type
  applies_to_kind: edge
  property: cleavage_probability
  value_type: float
  closed: false
  values: []
  sparse: true
  min_value: 0.0
  max_value: 1.0
  description: >
    Likelihood of the predicted cleavage site; SPARSE — absent with cleavage_site.

# ── presence markers: the two sanctioned sentinel-or-absent flags (R5) ──────
# Shape: closed, sparse, single value 'true'. ABSENCE is the negative state —
# consumers test `IS NULL` / `IS NOT NULL`, never compare against 'false'.
# Reserved for minority exception flags; a new two-state fact must be a named
# pair (e.g. stereo_assignment: as_reported | dominant_form_assumed), not a third marker.

BiologicalProcess.is_uninformative:
  applies_to: BiologicalProcess
  applies_to_kind: node
  property: is_uninformative
  value_type: string
  closed: true
  values: ['true']
  sparse: true
  description: >
    PRESENCE MARKER set post-import on
    catch-all terms that carry no functional information — for BiologicalProcess:
    the GO root term go:0008150 (biological_process). Absent on every informative term. Genes whose only
    annotations point at flagged terms are annotation_state = catch_all_only;
    the informative_only filter of the explorer is `t.is_uninformative IS NULL`.
  value_descriptions:
    'true': flagged as a catch-all term; absence of the property means the term is informative

MolecularFunction.is_uninformative:
  applies_to: MolecularFunction
