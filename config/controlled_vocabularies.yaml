  #   family_inferred > domain_inferred (KG-SYNC-005 / ONT-008). Direct blastp hit vs. the curated
  #   MEROPS scan library; strength WITHIN homology is read from `tier`. Orthogonal to call_class
  #   (the verdict axis): a nonpeptidase_homolog is still homology evidence for the placement.
  applies_to: Gene_has_merops_family
  applies_to_kind: edge
  property: evidence
  value_type: string
  closed: true
  values: [homology]
  description: >
    Inference strength on the shared ladder curated > signature > homology >
    family_inferred > domain_inferred. MEROPS families are homology: a direct
    blastp hit vs. the curated scan library; strength within homology is read
    from `tier`. Independent of call_class — a nonpeptidase_homolog is still
    homology evidence for the fold placement.
  value_descriptions:
    homology: direct sequence hit (diamond blastp) against a curated reference database (TCDB, MEROPS); strength within the rung is read from tier

Gene_has_tcdb_family.evidence:
  # provenance (moved out of the researcher-facing description, 2026-08-29):
  #   Rung of the shared inference-strength ladder curated > signature > homology >
  #   family_inferred > domain_inferred (KG-SYNC-005 / ONT-008). homology = diamond called it
  #   (direct blastp vs. the curated TCDB FASTA; strength within it from `tier`); family_inferred
  #   = eggNOG-only (orthology transfer). Both-source edges take the strongest (homology).
  applies_to: Gene_has_tcdb_family
  applies_to_kind: edge
  property: evidence
  value_type: string
  closed: true
  values: [family_inferred, homology]
  description: >
    Inference strength on the shared ladder curated > signature > homology >
    family_inferred > domain_inferred. homology = diamond blastp called it
    (strength within it from `tier`); family_inferred = eggNOG-only orthology
    transfer. An edge with both sources takes the stronger (homology).
  value_descriptions:
    family_inferred: transferred from an ortholog family or a single-function protein family (eggNOG orthology transfer, InterPro FAMILY entries)
    homology: direct sequence hit (diamond blastp) against a curated reference database (TCDB, MEROPS); strength within the rung is read from tier

Gene_has_merops_family.evidence_score:
  # provenance (moved out of the researcher-facing description, 2026-08-29):
  #   Advisory placement-confidence ranking, never a filter (ONT-006, R4). Two independent
  #   signals: tier <= 2 (identity >= 40%) and pfam_support = 'corroborated'. Scale is {0, 0.5,
  #   1}; round(score * 2) recovers the fired count. call_class is deliberately NOT a signal — it
  #   is the verdict axis (active peptidase?), read separately. NOT calibrated against the
  #   5-signal Gene_has_tcdb_family.evidence_score.
  applies_to: Gene_has_merops_family
  applies_to_kind: edge
  property: evidence_score
  value_type: float
  closed: false
  values: []
  min_value: 0.0
  max_value: 1.0
  signal_count: 2
  signals: [tier_le_2, pfam_support]
  description: >
    Advisory placement confidence in {0, 0.5, 1}, never a filter: one point
    for tier <= 2 (identity >= 40%), one for pfam_support = 'corroborated';
    round(score * 2) recovers the count. call_class (is it an active
    peptidase?) is a separate axis, deliberately not scored. Not comparable to
    Gene_has_tcdb_family.evidence_score (5 signals).

Gene.merops_evidence_score_max:
  applies_to: Gene
  applies_to_kind: node
  property: merops_evidence_score_max
  value_type: float
  closed: false
  values: []
  sparse: true
  min_value: 0.0
  max_value: 1.0
  description: >
    max(evidence_score) over the gene's Gene_has_merops_family edges (ONT-013,
    mirror of tcdb_evidence_score_max). SPARSE — absent when the gene has no
    MEROPS edge; coalesce(x, -1.0) for a total order. Read alongside
    Gene.merops_classes: this says how well the best call is PLACED,
    merops_classes says whether any call is an active peptidase.

Gene_has_tcdb_family.attachment_depth:
  # provenance (moved out of the researcher-facing description, 2026-08-29):
  #   Post-import structural fact (ONT-010, not a threshold — R3 does not apply). 'superseded' =
  #   another Gene_has_tcdb_family edge of the SAME gene lands on a descendant of this node (e.g.
  #   eggNOG 3.A.1 next to diamond 3.A.1.14) — a less specific call, NOT a wrong one.
  #   'most_specific' = no such sibling. The transport-arm counts
  #   (Gene.transported_metabolite_count, Metabolite.transporter_gene_count,
  #   Organism_has_metabolite) read only most_specific edges. Mirrors substrate_depth's value
  #   grammar.
  applies_to: Gene_has_tcdb_family
  applies_to_kind: edge
  property: attachment_depth
  value_type: string
  closed: true
  values: [most_specific, superseded]
  description: >
    most_specific = no other TCDB edge of the same gene lands on a descendant
    of this family; superseded = one does (e.g. an eggNOG 3.A.1 call next to a
    diamond 3.A.1.14 call) — a less specific call, not a wrong one.
    Transport-arm counts (Gene.transported_metabolite_count,
    Metabolite.transporter_gene_count, Organism_has_metabolite) read
    most_specific edges only.
  value_descriptions:
    most_specific: no other TCDB edge of this gene lands on a descendant of this family; the edge the transport-arm counts read
    superseded: a sibling edge of the same gene lands on a descendant family; less specific, not wrong

