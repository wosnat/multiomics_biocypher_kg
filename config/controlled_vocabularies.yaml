  #   (dense str[]) is rewritten post-import from these edges.
  applies_to: Tests_coculture_with
  applies_to_kind: edge
  property: partner_role
  value_type: string
  closed: true
  values: [treatment, background]
  value_descriptions:
    treatment: "the experiment tests the presence of this partner (coculture vs axenic, or phage infection vs uninfected)"
    background: "the partner shared the culture the measured samples came from and the experiment tests something else (a nutrient, glucose, light, growth phase); in a pooled design (background_factors lists both axenic and coculture) only part of the samples were cocultures"
  description: >
    Why this organism is linked to the experiment. treatment = the presence
