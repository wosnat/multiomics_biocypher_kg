  values: [p_value, no_p_value]
  description: >
    p_value = the metric reports a p-value, so p_value_threshold is set and
    post-import derives `significant` on its quantifies edges; no_p_value
    otherwise (always no_p_value on boolean and categorical metrics).

Derived_metric_quantifies_gene.significant:
  applies_to: Derived_metric_quantifies_gene
  applies_to_kind: edge
  property: significant
  value_type: string
  closed: true
  sparse: true
  values: [significant, not_significant]
  description: >
    Post-import: significant iff adjusted_p_value < the parent DerivedMetric's
    p_value_threshold. Only set when the parent has has_p_value = p_value, a
    threshold is configured and the edge carries a non-null adjusted_p_value;
    absent otherwise. Same pair as Changes_expression_of.expression_status's
    not_significant token.

Derived_metric_flags_gene.value:
  applies_to: Derived_metric_flags_gene
  applies_to_kind: edge
  property: value
  value_type: string
  closed: true
  values: [flagged, not_flagged]
  description: >
    The boolean metric's outcome for this gene: flagged = the paper's
    true-token (or blank_policy true) applied; not_flagged = the false-token
    applied. Rows the paper skipped produce no edge.

Assay_flags_metabolite.flag_value:
  applies_to: Assay_flags_metabolite
  applies_to_kind: edge
  property: flag_value
  value_type: string
  closed: true
  values: [detected, not_detected]
  description: >
    Presence flag for this metabolite in this sample column: detected iff the
    cell equals the column's flag_true_value. Same pair as
    Assay_quantifies_metabolite.detection_status minus its `sporadic` state
    (a single presence call cannot be sporadic). About 62% of rows are
    not_detected — tested-absent is real data, never noise. Was undeclared
    until 2026-08-28.

# ── MEROPS + NCBIfam + InterPro evalue_library (2026-08-18 merge) ────────────
# MEROPS vocab (level_kind, family_type, call_class, best_hit_kind) is
# KG-minted and verified against multiomics_kg/utils/merops_diamond.py's
# CATALYTIC_TYPE_WORDS / call_class() / id_kind() and
# config/schema_config.yaml's `merops family` / `gene to merops family
# association` blocks. NcbifamFamily.family_type and
# Gene_has_interpro_entry.evalue_library are external controlled vocabulary
# (NCBIfam's own label / InterProScan's own member-DB name) and are
# preserved verbatim per house rule R1's external-source exception.

MeropsFamily.level_kind:
  # provenance (moved out of the researcher-facing description, 2026-08-29):
  #   classify_code() in multiomics_kg/utils/merops_diamond.py.
  applies_to: MeropsFamily
  applies_to_kind: node
  property: level_kind
  value_type: string
  closed: true
  values: [merops_clan, merops_family, merops_subfamily]
  description: >
    Named depth of this node in the MEROPS hierarchy: merops_clan (level 0,
    e.g. SC), merops_family (1, e.g. S14), merops_subfamily (2, e.g. S08A).
    Parallels the integer level.

MeropsFamily.family_class:
  # provenance (moved out of the researcher-facing description, 2026-08-29):
  #   KG-minted two-state label for a MEROPS family/subfamily/clan. Renamed from family_type
  #   (KG-SYNC-005 / ONT-012, R1b): the same property name on NcbifamFamily holds an unrelated
  #   external vocabulary. Harvested from family_type() in multiomics_kg/utils/merops_diamond.py
  #   ("inhibitor" for I-prefixed codes, else "peptidase"); matches config/schema_config.yaml's
  #   `merops family` node comment `family_type: str # "peptidase" | "inhibitor" (I-families)`
  #   exactly.
  applies_to: MeropsFamily
  applies_to_kind: node
  property: family_class
  value_type: string
  closed: true
  values: [peptidase, inhibitor]
  description: >
    Whether a MEROPS family / subfamily / clan groups peptidases or peptidase
    inhibitors (I-prefixed codes). Inhibitors are kept because protease
    inhibitors are biology; use it to keep them out of protease counts.

MeropsFamily.catalytic_type:
  # provenance (moved out of the researcher-facing description, 2026-08-29):
  #   VALUES of CATALYTIC_TYPE_WORDS in multiomics_kg/utils/merops_diamond.py;
  #   catalytic_type_word() returns None for I-families. Kept as the full MEROPS
  #   code set on purpose (external vocabulary mirrored whole) — DOC-004, 2026-08-29.
  applies_to: MeropsFamily
  applies_to_kind: node
  property: catalytic_type
  value_type: string
  closed: true
  sparse: true
  values: [serine, cysteine, metallo, aspartic, threonine, glutamic,
           asparagine_lyase, mixed, unknown]
  description: >
    Catalytic mechanism of a peptidase family, MEROPS's single-letter code
    spelled out (S = serine, C = cysteine, M = metallo, A = aspartic, T =
    threonine, G = glutamic, N = asparagine_lyase, P = mixed, U = unknown).
    The list is the complete MEROPS code set, so a value may be absent from a
    given build (no glutamic-peptidase family is observed in the current
    corpus). Absent on inhibitor families.

Gene_has_merops_family.call_class:
  # provenance (moved out of the researcher-facing description, 2026-08-29):
  #   the three return statements of call_class() in multiomics_kg/utils/merops_diamond.py.
  applies_to: Gene_has_merops_family
  applies_to_kind: edge
  property: call_class
  value_type: string
  closed: true
  values: [peptidase, inhibitor, nonpeptidase_homolog]
  description: >
    Read-first verdict for one MEROPS candidate: inhibitor when the family is
    an I-family, nonpeptidase_homolog when the best hit is a catalytically
    dead .9xx entry (fold evidence, not protease evidence), else peptidase.
    Threshold-free; orthogonal to evidence and pfam_support.
  value_descriptions:
    peptidase: best hit is a characterized or putative active peptidase; protease evidence
    inhibitor: family is a MEROPS I-family; the product is a peptidase inhibitor, not a protease
    nonpeptidase_homolog: best hit is a catalytically dead .9xx relative; fold evidence only, NOT protease evidence

Gene_has_merops_family.best_hit_kind:
  # provenance (moved out of the researcher-facing description, 2026-08-29):
  #   id_kind() in multiomics_kg/utils/merops_diamond.py.
  applies_to: Gene_has_merops_family
  applies_to_kind: edge
  property: best_hit_kind
  value_type: string
  closed: true
  values: [holotype, putative, nonpeptidase_homolog]
  description: >
    Kind of MEROPS entry the candidate's best (highest-identity) hit is:
    holotype (a characterized peptidase, identifier tail 001-899), putative
    (a letter-prefixed identifier, not yet characterized), or
    nonpeptidase_homolog (a 9xx tail — a catalytically dead relative).
  value_descriptions:
    holotype: characterized MEROPS identifier (numeric tail 001-899)
    putative: letter-prefixed identifier; sequence-only, uncharacterized member
    nonpeptidase_homolog: 9xx identifier; catalytically inactive homolog

NcbifamFamily.family_type:
  # provenance (moved out of the researcher-facing description, 2026-08-29):
  #   NCBIfam/TIGRFAM's own specificity-label vocabulary (flat ontology, no hierarchy column in
  #   source), plus ONE KG-minted sentinel: 'retired' marks an accession a strain's InterProScan
  #   run still calls but the current NCBIfam reference release no longer lists (10 nodes, all
  #   NF*; ONT-004) — the node keeps its calls.json name and no other reference field. EXTERNAL —
  #   preserved verbatim in NCBIfam's own mixed casing (including "PfamEq" / "PfamAutoEq", not
  #   lowercased or snake_cased) per house rule R1's external-source exception, so the graph stays
  #   directly comparable to the NCBIfam reference data. Harvested by scanning the distinct
  #   `family_type` values across all 38,394 entries in cache/data/ncbifam/ncbifam_reference.json
  #   (built by prepare_data step 9 / build_ncbifam_reference.py); confirmed against
  #   config/schema_config.yaml's `ncbifam family` node comment listing the same value set.
  applies_to: NcbifamFamily
  applies_to_kind: node
  property: family_type
  value_type: string
  closed: true
  values: [PfamAutoEq, PfamEq, domain, equivalog, equivalog_domain, exception,
           hypoth_equivalog, hypoth_equivalog_domain, paralog, paralog_domain,
           repeat, retired, signature, subfamily, subfamily_domain, superfamily]
  description: >
    NCBIfam / TIGRFAM's own specificity label for the family (equivalog,
    subfamily, domain, hypoth_equivalog, PfamEq, ...). equivalog-class
    families are near-EC-grade specific; hypoth_* families are flagged
    uninformative. One KG-minted sentinel, 'retired', marks an accession a
    strain's InterProScan run still calls but the current NCBIfam release no
    longer lists. NCBIfam's own mixed casing, kept verbatim.

Gene_has_interpro_entry.evalue_library:
  # provenance (moved out of the researcher-facing description, 2026-08-29):
  #   Which InterProScan member database reported the edge's (best/min) evalue. EXTERNAL — same
  #   UPPERCASE member-DB name set as the existing Gene_has_interpro_entry.libraries entry, copied
  #   verbatim per house rule R1's external-source exception (InterProScan's own controlled
  #   vocabulary, kept comparable to the source); not lowercased. SPARSE — set only when a match
  #   reports an evalue at all (~58% of matches, per schema_config.yaml's `evalue` comment
  #   "omitted when all matches lack one"); a gene's edge with no reporting library carries no
  #   evalue_library.
  applies_to: Gene_has_interpro_entry
  applies_to_kind: edge
  property: evalue_library
  value_type: string
  closed: true
  sparse: true
  values: [CDD, GENE3D, HAMAP, NCBIFAM, PANTHER, PFAM, PIRSF, PRINTS,
           PROSITE_PATTERNS, PROSITE_PROFILES, SFLD, SMART, SUPERFAMILY]
  description: >
    Which InterProScan member database reported the edge's best (minimum)
    e-value. Same upper-case name set as `libraries`. Absent when no matching
    library reported an e-value (~42% of matches).

# ── MEROPS peptidase layer: 2026-08-18 follow-up entries (tier / pfam_support /
#    cleavage_p1_residues / member_id_count / merops_classes). Pre-existing
#    entries (call_class / best_hit_kind / level_kind / family_type / catalytic_type)
#    declared above. Spec: docs/superpowers/specs/2026-08-18-merops-pfam-bridge-cleavage-design.md ──

Gene_has_merops_family.tier:
  applies_to: Gene_has_merops_family
  applies_to_kind: edge
  property: tier
  value_type: int
  closed: false
  values: []
  min_value: 1
  max_value: 3
  description: >
    tcdb-diamond confidence band and truncation depth: 1 = MEROPS identifier
    (identity >= 70), 2 = subfamily (identity >= 40), 3 = family (floor only).
    NOT sparse — unlike Gene_has_tcdb_family.tier, every merops edge is
    diamond-sourced and carries one. ~92% tier 3 (expected remote homology).

Gene_has_merops_family.pfam_support:
  applies_to: Gene_has_merops_family
  applies_to_kind: edge
  property: pfam_support
  value_type: string
  closed: true
  values: [corroborated, uncorroborated]
  description: >
    Whether a Pfam domain on this gene is curated into this MEROPS family via
    Merops_family_has_pfam_domain. Read in the sound direction only.
  value_descriptions:
    corroborated: the gene carries a Pfam domain that MEROPS curates into this peptidase family (fold placement corroborated; says nothing about catalytic activity)
    uncorroborated: no Pfam domain on the gene is curated into this family; absence of support, not contradiction

MeropsFamily.cleavage_p1_residues:
  applies_to: MeropsFamily
  applies_to_kind: node
  property: cleavage_p1_residues
  value_type: string_array
  closed: true
  values: [Ala, Arg, Asn, Asp, Cys, Gln, Glu, Gly, His, Ile,
           Leu, Lys, Met, Phe, Pro, Ser, Thr, Trp, Tyr, Val]
  sparse: true
  description: >
    Top P1 residues (Schechter-Berger: the residue N-terminal of the scissile
    bond) with >= 10% share of curated cleavages, max 3, frequency order.
    Filtered to the 20 standard residues. SPARSE — level-1 families with
    curated cleavage data only; read known_cleavage_count for support.

Merops_family_has_pfam_domain.member_id_count:
  applies_to: Merops_family_has_pfam_domain
  applies_to_kind: edge
  property: member_id_count
  value_type: int
  closed: false
  values: []
  min_value: 1
  description: >
    How many distinct curated MEROPS identifiers back this (family, Pfam)
    pair in MEROPS's interpro.txt. Support size, not a filter.

Gene.merops_classes:
  applies_to: Gene
  applies_to_kind: node
  property: merops_classes
  value_type: string_array
  closed: true
  values: [peptidase, inhibitor, nonpeptidase_homolog]
  description: >
    Sorted distinct call_class values across the gene's Gene_has_merops_family
    edges — the at-a-glance guard so a gene whose only call is a dead homolog
    never reads as "1 protease". Empty when the gene has no merops edge.

