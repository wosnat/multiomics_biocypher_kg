Experiment.treatment_type:
  # provenance (moved out of the researcher-facing description, 2026-08-29):
  #   Harvested from CLAUDE.md's "treatment_type canonical values" bullet, per the controller
  #   ruling designating CLAUDE.md as authority for this property. DENSE and NON-EMPTY (min_size
  #   1) on every Experiment — a non-empty list is the explorer's indicator that the node is a
  #   real experiment, so characterization studies get a short categorical value naming what was
  #   measured instead of []: rna_decay (Steglich 2010 rifampicin half-lives), tss_mapping (Voigt
  #   2014 TSS maps), genomic_analysis (Hackl 2023 genomic islands, on ClusteringAnalysis). Add a
  #   new value when a new paper fits nothing here. "oxygen" added 2026-08-27 — first emitted by
  #   Bernstein 2017's BP-1 / M. ruber turbidostat pO2 steady states. neo4j-admin import drops an
  #   empty string[] cell, so post-import re-materializes [] on the denormalized labels
  #   (ClusteringAnalysis / DerivedMetric / MetaboliteAssay) where [] is still legal.
  #   scripts/validate_paperconfig.py loads this list (CANONICAL_TREATMENT_TYPES). "chemical"
  #   added 2026-08-19 — first emitted by Hackl 2023's MIT0604 mitomycin-C experiments (previously
  #   validator-only). FINDING: scripts/validate_paperconfig.py does NOT enforce this narrower
  #   per-field list. It validates treatment_type and background_factors against one SHARED
  #   17-value set (CANONICAL_CONDITION_TYPES, lines ~189-213) that also contains "mutant" and
  #   "axenic" — which do not appear in this list. A paperconfig using treatment_type: [mutant] or
  #   treatment_type: [axenic] would pass validation but the resulting value would violate this
  #   closed vocabulary if ever emitted. Declared per CLAUDE.md as instructed; the validator's
  #   wider allowance is unreconciled and worth tightening or re-documenting. See
  #   task-10-report.md.
  applies_to: Experiment
  applies_to_kind: node
  property: treatment_type
  value_type: string_array
  closed: true
  values: [nitrogen, phosphorus, iron, carbon, salt, light, temperature,
           plastic, darkness, diel, viral, coculture, growth_phase, compartment,
           chemical, oxygen, rna_decay, tss_mapping, genomic_analysis]
  min_size: 1
  description: >
    The manipulated variable(s) of the experiment — nitrogen, phosphorus,
    iron, carbon, salt, light, temperature, plastic, darkness, diel, viral,
    coculture, growth_phase, compartment, chemical, oxygen — or, for a
    characterization study with no perturbation, what was measured: rna_decay,
    tss_mapping, genomic_analysis. Always non-empty: a non-empty list is the
    sign that the node is a real experiment.

