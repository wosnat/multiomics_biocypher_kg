# Controlled vocabularies published as ControlledVocabulary nodes.
#
# THE source of truth: adapters import their literals from here via
# multiomics_kg/utils/controlled_vocab.py, and tests assert the live graph
# matches. See docs/superpowers/specs/2026-08-16-vocabulary-contract-design.md.
#
# Required keys: applies_to, applies_to_kind, property, value_type, closed,
#                values, description
# Optional:      sparse, expected_empty, min_value, max_value,
#                signal_count, signals
#
# value_type ∈ {string, string_array, float, int}
#   'bool' and 'bool_string' are NOT admissible — house rule R5. A closed,
#   sparse, 'true'-only entry is a PRESENCE MARKER (see the section at the end).

# ── evidence: per edge type, domains genuinely differ (spec §5.2) ────────────
Gene_has_pfam.evidence:
  applies_to: Gene_has_pfam
  applies_to_kind: edge
  property: evidence
  value_type: string
  closed: true
  values: [curated, signature, family_inferred]
  description: >
    Inference strength for this annotation. `signature` = a direct Pfam HMM
    hit (InterProScan); `family_inferred` = the domain is known only from
    ortholog-group transfer by eggNOG, with no direct hit. domain_inferred is
    NOT possible on this edge type.
  value_descriptions:
    curated: assigned by a human curator or a curated reference annotation (Cyanorak, UniProt, NCBI); strongest rung
    signature: direct HMM / profile hit against a member database that pre-applies its own curated threshold (InterProScan, Pfam)
    family_inferred: transferred from an ortholog family (eggNOG orthology transfer) with no direct HMM hit

Gene_catalyzes_ec_number.evidence:
  applies_to: Gene_catalyzes_ec_number
  applies_to_kind: edge
  property: evidence
  value_type: string
  closed: true
  values: [curated, family_inferred]
  description: >
    Inference strength. InterPro contributes EC only from FAMILY entries with
    a single EC, so domain_inferred is not possible on this edge type.
  value_descriptions:
    curated: assigned by a human curator or a curated reference annotation (Cyanorak, UniProt, NCBI); strongest rung
    family_inferred: transferred from an ortholog family or a single-function protein family (eggNOG orthology transfer, InterPro FAMILY entries)

Gene_involved_in_biological_process.evidence: &go_evidence
  applies_to: Gene_involved_in_biological_process
  applies_to_kind: edge
  property: evidence
  value_type: string
  closed: true
  values: [curated, family_inferred, domain_inferred]
  description: >
    Inference strength on the shared ladder curated > signature > homology >
    family_inferred > domain_inferred (homology cannot occur on this edge).
    InterPro contributes GO from FAMILY and DOMAIN entries.
  value_descriptions:
    curated: assigned by a human curator or a curated reference annotation (Cyanorak, UniProt, NCBI); strongest rung
    family_inferred: transferred from an ortholog family or a single-function protein family (eggNOG orthology transfer, InterPro FAMILY entries)
    domain_inferred: transferred from a shared domain (InterPro DOMAIN entry); weakest rung, since a domain can occur outside the annotated function

Gene_enables_molecular_function.evidence:
  <<: *go_evidence
  applies_to: Gene_enables_molecular_function

Gene_located_in_cellular_component.evidence:
  <<: *go_evidence
  applies_to: Gene_located_in_cellular_component

Gene_has_cazy_family.evidence:
  applies_to: Gene_has_cazy_family
  applies_to_kind: edge
  property: evidence
  value_type: string
  closed: true
  values: [curated, family_inferred, domain_inferred]
  description: Inference strength for this CAZy assignment.
  value_descriptions:
    curated: assigned by a human curator or a curated reference annotation (Cyanorak, UniProt, NCBI); strongest rung
    family_inferred: transferred from an ortholog family or a single-function protein family (eggNOG orthology transfer, InterPro FAMILY entries)
    domain_inferred: transferred from a shared domain (InterPro DOMAIN entry); weakest rung, since a domain can occur outside the annotated function

# ── sources: also per edge type (KG-IPT-011); each value joins DataSource.id = `data_source:`+value ──────
Gene_has_pfam.sources:
  applies_to: Gene_has_pfam
  applies_to_kind: edge
  property: sources
  value_type: string_array
  closed: true
  values: [cyanorak, eggnog, interproscan, uniprot]
  description: >
    Who asserted this annotation. Each value joins a DataSource node via
    id = `data_source:` + value.
  value_descriptions:
    cyanorak: Cyanorak curated cyanobacterial annotation (Prochlorococcus / Synechococcus strains only)
    eggnog: eggNOG-mapper orthology transfer from the seed ortholog group
    interproscan: InterProScan 5 domain / family scan across its member databases
    uniprot: UniProt entry for the protein (curated and automatic annotation)

Gene_catalyzes_ec_number.sources:
  applies_to: Gene_catalyzes_ec_number
  applies_to_kind: edge
  property: sources
  value_type: string_array
  closed: true
  values: [cyanorak, eggnog, interproscan, uniprot]
  description: Who asserted this annotation. Each value joins a DataSource node via id = `data_source:` + value.
  value_descriptions:
    cyanorak: Cyanorak curated cyanobacterial annotation (Prochlorococcus / Synechococcus strains only)
    eggnog: eggNOG-mapper orthology transfer from the seed ortholog group
    interproscan: InterProScan 5 domain / family scan across its member databases
    uniprot: UniProt entry for the protein (curated and automatic annotation)

Gene_involved_in_biological_process.sources: &go_sources
  applies_to: Gene_involved_in_biological_process
  applies_to_kind: edge
  property: sources
  value_type: string_array
  closed: true
  values: [cyanorak, eggnog, interproscan, ncbi, uniprot]
  description: >
    Who asserted this annotation. Each value joins a DataSource node via id = `data_source:` + value. ncbi contributes
    only to the GO edges.
  value_descriptions:
    cyanorak: Cyanorak curated cyanobacterial annotation (Prochlorococcus / Synechococcus strains only)
    eggnog: eggNOG-mapper orthology transfer from the seed ortholog group
    interproscan: InterProScan 5 domain / family scan across its member databases
    ncbi: NCBI RefSeq / PGAP genome annotation (GFF); contributes GO terms only
    uniprot: UniProt entry for the protein (curated and automatic annotation)

Gene_enables_molecular_function.sources:
  <<: *go_sources
  applies_to: Gene_enables_molecular_function

Gene_located_in_cellular_component.sources:
  <<: *go_sources
  applies_to: Gene_located_in_cellular_component

Gene_has_cazy_family.sources:
  applies_to: Gene_has_cazy_family
  applies_to_kind: edge
  property: sources
  value_type: string_array
  closed: true
  values: [eggnog, interproscan]
  description: Who asserted this annotation. Each value joins a DataSource node via id = `data_source:` + value.
  value_descriptions:
    eggnog: eggNOG-mapper orthology transfer from the seed ortholog group
    interproscan: InterProScan 5 domain / family scan across its member databases

Gene_has_tcdb_family.sources:
  # provenance: TCDB cleanup (2026-10-23) — the adapter no longer merges the two sources
  #   onto one edge; one edge per (gene, TC node, tcdb_call), so the list has one element.
  applies_to: Gene_has_tcdb_family
  applies_to_kind: edge
  property: sources
  value_type: string_array
  closed: true
  values: [eggnog, tcdb_diamond]
  description: >
    Evidence source of this transporter call; a one-element list. Each value
    joins a DataSource node via id = `data_source:` + value. Both diamond call
    kinds read tcdb_diamond, so read tcdb_call to tell them apart. Agreement
    between sources is not stored on the edge: query whether two edges of the
    gene land on the same node or lineage.
  value_descriptions:
    eggnog: eggNOG-mapper orthology transfer from the seed ortholog group
    tcdb_diamond: diamond blastp vs. the curated TCDB transporter FASTA

Gene_has_tcdb_family.tcdb_call:
  applies_to: Gene_has_tcdb_family
  applies_to_kind: edge
  property: tcdb_call
  value_type: string
  closed: true
  values: [eggnog, diamond_tier, diamond_best_hit]
  description: >
    Which kind of call made this edge. One edge per (gene, TC node, call
    kind): the same gene and node can carry up to three edges, and that
    overlap is the agreement signal. Dense.
  value_descriptions:
    eggnog: a TC id that eggNOG-mapper names for the gene (KEGG_TC orthology transfer), at the depth eggNOG gives it; ids TCDB no longer lists are moved to their nearest listed ancestor
    diamond_tier: the tiered diamond call, truncated by tier (tier 1 lands on a transport system, tier 2 on a subfamily, tier 3 on a family); identity, qcov, scov and evalue belong to the consensus hit of the call
    diamond_best_hit: one of the best-hit transport systems of the protein (up to 3, the top hit plus near-ties within 0.9 of its bitscore, each reciprocal-best with both sequences at least 75 percent covered); rank, tier and the alignment statistics belong to that system alone

Gene_has_tcdb_family.tcdb_gate:
  applies_to: Gene_has_tcdb_family
  applies_to_kind: edge
  property: tcdb_gate
  value_type: string
  closed: true
  values: [direct, annotated, below_gate]
  description: >
    Which downstream rule this edge passes, so rows and counts are read from
    the same set. Ordered and nested: direct edges also pass the annotation
    gate, so the annotated set is tcdb_gate IN [direct, annotated]. Transport
    substrate counts read direct edges only; the tcdb annotation type,
    Gene.tcdb_assignment_count, TcdbFamily gene counts and enrichment gene sets
    read direct and annotated edges. Dense.
  value_descriptions:
    direct: a diamond_best_hit edge with rank 1 and tier at most 2 (identity at least 40), an eggnog edge, or a diamond_tier edge with tier 1, in each case onto a transport system (a 5-part TC id, after moving retired ids to their ancestor); the gene reaches the substrates of this system
    annotated: any other eggnog edge, a diamond_tier edge with tier 2, a diamond_tier edge with tier 1 that is not on a transport system, or a rank-1 diamond_best_hit with tier at most 2 that is not on a transport system; counts as TCDB annotation but reaches no substrates
    below_gate: everything else (diamond_tier tier 3, near-tie best hits with rank above 1, and rank-1 best hits with tier 3); evidence kept for inspection, used by no count

Gene_has_tcdb_family.tier:
  applies_to: Gene_has_tcdb_family
  applies_to_kind: edge
  property: tier
  value_type: int
  closed: false
  values: []
  min_value: 1
  max_value: 3
  sparse: true
  description: >
    Confidence band, derived differently on the two diamond call kinds; never
    compare tier across kinds. On diamond_tier edges it is the consensus tier
    and also the truncation depth: 1 = tc_system (identity >= 70), 2 =
    tc_subfamily (identity >= 40), 3 = tc_family (no identity floor). On
    diamond_best_hit edges it is the identity band of that system alone, with
    no consensus step: 1 = identity >= 70, 2 = 40 <= identity < 70, 3 =
    identity < 40. Present on every diamond edge; absent on eggnog edges.

Gene_has_tcdb_family.rank:
  applies_to: Gene_has_tcdb_family
  applies_to_kind: edge
  property: rank
  value_type: int
  closed: false
  values: []
  min_value: 1
  max_value: 3
  sparse: true
  description: >
    Position of this best-hit system among the best hits of the protein:
    1 = top hit, 2 and 3 = near-ties. Unique per gene; ordered by bitscore,
    then TC id, then subject. Present on diamond_best_hit edges only.

Gene_has_tcdb_family.bitscore:
  applies_to: Gene_has_tcdb_family
  applies_to_kind: edge
  property: bitscore
  value_type: float
  closed: false
  values: []
  sparse: true
  min_value: 0.0
  description: >
    blastp bitscore of the highest-scoring alignment of the protein to this
    best-hit system. Present on diamond_best_hit edges only.

Gene_has_tcdb_family.bitscore_ratio:
  applies_to: Gene_has_tcdb_family
  applies_to_kind: edge
  property: bitscore_ratio
  value_type: float
  closed: false
  values: []
  sparse: true
  min_value: 0.9
  max_value: 1.0
  description: >
    bitscore of this best-hit system divided by the bitscore of the top hit:
    1.0 at rank 1, at least 0.9 for near-ties. Present on diamond_best_hit
    edges only.

Gene_has_tcdb_family.scov:
  applies_to: Gene_has_tcdb_family
  applies_to_kind: edge
  property: scov
  value_type: float
  closed: false
  values: []
  sparse: true
  min_value: 0.0
  max_value: 100.0
  description: >
    Subject (TCDB reference sequence) coverage of the alignment, percent
    0-100. Present on diamond edges only (absent on eggnog edges).

# provenance: multiomics_kg.utils.tcdb_utils.tcdb_direction + config/tcdb_direction_overrides.yaml;
# rule tightened by the 2026-10-24 seven-reviewer audit (docs/kg-changes/tcdb-cleanup.md).
TcdbFamily.direction:
  applies_to: TcdbFamily
  applies_to_kind: node
  property: direction
  value_type: string
  closed: true
  values: [uptake, export, unknown]
  description: >
    Transport direction as TCDB states it, read conservatively: weak, two-way
    or contested evidence reads unknown. Two sources only. (1) The own name of a system
    in TCDB, on tc_system nodes: a name that says uptake, import or influx,
    or export, efflux, extrusion or secretion (secretion is export), decides
    unless it states the direction tentatively (putative, probable, may,
    uncharacterized, a question mark), names a process the protein only takes
    part in (involved in, controls, affects, required for), negates it, names an organelle (vacuolar, mitochondrial, peroxisomal or
    vesicle transport is not cell uptake or export), calls the protein a
    homologue, or states both directions. Family and subfamily names never give
    a direction, to themselves or to their systems: a family is named after its
    characterized member, and its relatives may go the other way. (2) ABC
    uptake numbering: ABC subfamilies 3.A.1.1 to 3.A.1.99 and their systems
    are uptake unless a name says export or the function is unknown. The TCDB
    description of the node can only remove a direction (both directions, under
    debate, or the opposite direction in its first sentence), and a curated list
    of exceptions, each with a reason and a reference, removes it from systems
    and families whose direction is disputed or that are not transporters.
    Family and subfamily nodes outside the ABC uptake range are always unknown.
    A property of the characterized TCDB reference system: a gene inherits it
    only by homology. For outer-membrane proteins, export means across the outer
    membrane. direction_basis says which source set it.
  value_descriptions:
    uptake: TCDB states transport into the cell, by the unhedged own name of a system, or because the node is or lies under an ABC uptake subfamily (3.A.1.1 to 3.A.1.99) and nothing says otherwise
    export: TCDB states transport out of the cell (export, efflux, extrusion or secretion), by the unhedged own name of a system
    unknown: TCDB states no direction for this node itself, or states it tentatively, for an organelle, for both directions, in conflict with the ABC numbering or with its own description, or the direction is disputed; always unknown for family and subfamily nodes outside the ABC uptake range. Not evidence of either direction

TcdbFamily.direction_basis:
  applies_to: TcdbFamily
  applies_to_kind: node
  property: direction_basis
  value_type: string
  closed: true
  sparse: true
  values: [abc_numbering, tcdb_name]
  description: >
    Which source set direction. Sparse: absent when direction is unknown.
  value_descriptions:
    abc_numbering: the node is, or lies under, an ABC subfamily numbered 3.A.1.1 to 3.A.1.99, which TCDB reserves for uptake systems; applied unless a TCDB name says export, the own name says the function is unknown, or the description doubts it
    tcdb_name: the own TCDB name of this system (tc_system nodes only) contains exactly one of the word groups uptake, import, influx or export, efflux, extrusion, secretion, secretory (whole word, any case), unhedged, not a process the protein only takes part in, and not organellar

TcdbFamily.tcdb_substrate_count:
  applies_to: TcdbFamily
  applies_to_kind: node
  property: tcdb_substrate_count
  value_type: int
  closed: false
  values: []
  min_value: 0
  description: >
    Distinct substrates (Metabolite and ChemicalRole nodes) that TCDB curates
    for the transport systems in the subtree of this node; on a system, its own
    substrate count. Dense on every level, 0 when none. This is the full TCDB
    range of the node, including systems no gene here points at; substrate
    names TCDB gives that resolve to no compound are not counted. A count of
    curated substrates, not of what a gene transports.

# ── evidence_score: normalized float, signals published (R4, KG-IPT-012) ─────
Gene_has_pfam.evidence_score: &score3
  applies_to: Gene_has_pfam
  applies_to_kind: edge
  property: evidence_score
  value_type: float
  closed: false
  values: []
  min_value: 0.0
  max_value: 1.0
  signal_count: 3
  signals: [multi_source, high_trust_assertion, not_domain_inferred]
  description: >
    Advisory ranking, never a filter. Fraction of independent corroborating
    signals that fired; round(score * signal_count) recovers the raw count.
    NOT calibrated against other edge types — compare within an edge type.
    Float: sort and threshold, never test equality.

Gene_catalyzes_ec_number.evidence_score:
  <<: *score3
  applies_to: Gene_catalyzes_ec_number
Gene_involved_in_biological_process.evidence_score:
  <<: *score3
  applies_to: Gene_involved_in_biological_process
Gene_enables_molecular_function.evidence_score:
  <<: *score3
  applies_to: Gene_enables_molecular_function
Gene_located_in_cellular_component.evidence_score:
  <<: *score3
  applies_to: Gene_located_in_cellular_component
Gene_has_cazy_family.evidence_score:
  <<: *score3
  applies_to: Gene_has_cazy_family

Metabolite.identity_basis:
  applies_to: Metabolite
  applies_to_kind: node
  property: identity_basis
  value_type: string_array
  closed: true
  sparse: true
  values: [mnx_same_entity, chebi_kegg_xref, chebi_conjugate, chebi_tautomer, manual]
  description: >
    Why the ids on this metabolite were merged into one node. Sparse: absent on
    metabolites that were never merged or re-keyed.
  value_descriptions:
    mnx_same_entity: MetaNetX reconciles the merged ids as one entity
    chebi_kegg_xref: a ChEBI term and the KEGG compound it cross-references
    chebi_conjugate: conjugate acid / base forms of one physiological species
    chebi_tautomer: tautomers of one compound
    manual: a curated merge with a recorded reason

Metabolite.structure_kind:
  applies_to: Metabolite
  applies_to_kind: node
  property: structure_kind
  value_type: string
  closed: true
  values: [defined, generic, polymer]
  description: >
    What kind of chemical structure this metabolite is.
  value_descriptions:
    defined: one concrete structure
    generic: a class or a structure with R groups; no single formula mass
    polymer: a repeat-unit polymer; formula is the repeat unit

Metabolite.kegg_functional_categories:
  applies_to: Metabolite
  applies_to_kind: node
  property: kegg_functional_categories
  value_type: string_array
  closed: true
  sparse: true
  values: [Organic acids, Lipids, Carbohydrates, Nucleic acids, Peptides, Vitamins and cofactors, Steroids, Hormones and transmitters, Antibiotics]
  description: >
    Level-0 categories of KEGG compound BRITE br08001 (compounds with biological roles)
    that list this metabolite. Sparse: absent when KEGG does not list the metabolite in
    br08001. The list is hand-curated and partial (about 10% of metabolites), so absence is
    not evidence that a category does not apply.

# No value_descriptions: the values contain ": ", which is the "<value>: <description>"
# separator of published value_descriptions; the tree codes are in the description instead.
Metabolite.kegg_brite_classes:
  applies_to: Metabolite
  applies_to_kind: node
  property: kegg_brite_classes
  value_type: string_array
  closed: true
  sparse: true
  values:
    - "Bioactive peptides: Cardiovascular peptides"
    - "Bioactive peptides: Neuropeptides"
    - "Endocrine disrupting compounds: Pesticides and herbicides"
    - "Endocrine disrupting compounds: Plasticizers and plastics"
    - "Glycosides: N-glycosides"
    - "Glycosides: O-glycosides"
    - "Glycosides: S-glycosides"
    - "Lipids: Fatty acyls"
    - "Lipids: Glycerolipids"
    - "Lipids: Glycerophospholipids"
    - "Lipids: Polyketides"
    - "Lipids: Prenol lipids"
    - "Lipids: Saccharolipids"
    - "Lipids: Sphingolipids"
    - "Lipids: Sterol lipids"
    - "Natural toxins: Fungal toxins"
    - "Natural toxins: Marine biotoxins"
    - "Natural toxins: Phytotoxins"
    - "Pesticides: Obsolete pesticides"
    - "Pesticides: Pesticides"
    - "Phytochemical compounds: Alkaloids"
    - "Phytochemical compounds: Amino acid related compounds"
    - "Phytochemical compounds: Fatty acids related compounds"
    - "Phytochemical compounds: Flavonoids"
    - "Phytochemical compounds: Others"
    - "Phytochemical compounds: Phenylpropanoids"
    - "Phytochemical compounds: Shikimate / acetate-malonate pathway derived compounds"
    - "Phytochemical compounds: Terpenoids"
  description: >
    Top-level classes of the seven KEGG compound BRITE trees other than br08001 that contain
    this metabolite, as "<Tree>: <class>" (Lipids = br08002, Phytochemical compounds = br08003,
    Bioactive peptides = br08005, Endocrine disrupting compounds = br08006, Pesticides =
    br08007, Natural toxins = br08009, Glycosides = br08021). Sparse: absent when KEGG does
    not list the metabolite in any of these trees. The lists are hand-curated and partial
    (about 20% of metabolites), so absence is not evidence that a class does not apply.

MetaboliteClass.level_kind:
  applies_to: MetaboliteClass
  applies_to_kind: node
  property: level_kind
  value_type: string
  closed: true
  values: [kegg_compound_class, kegg_compound_subclass, kegg_compound_group, kegg_compound_subgroup]
  description: >
    Depth tier of a KEGG compound BRITE class node (level 0 to 3).

MetaboliteClass.tree:
  applies_to: MetaboliteClass
  applies_to_kind: node
  property: tree
  value_type: string
  closed: true
  values: [compounds_with_biological_roles, lipids, phytochemical_compounds, bioactive_peptides, endocrine_disrupting_compounds, pesticides, natural_toxins, glycosides]
  description: >
    Which KEGG compound BRITE tree this class belongs to.

ChemicalRole.level_kind:
  applies_to: ChemicalRole
  applies_to_kind: node
  property: level_kind
  value_type: string
  closed: true
  values: [chebi_role_branch, chebi_role]
  description: >
    chebi_role_branch is a top-level branch of the ChEBI role ontology;
    chebi_role is any term below it.

Metabolite_in_metabolite_class.sources:
  applies_to: Metabolite_in_metabolite_class
