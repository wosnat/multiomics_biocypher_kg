# Controlled vocabularies published as ControlledVocabulary nodes.
#
# THE source of truth: adapters import their literals from here via
# multiomics_kg/utils/controlled_vocab.py, and tests assert the live graph
# matches. See docs/superpowers/specs/2026-08-16-vocabulary-contract-design.md.
#
# Required keys: applies_to, applies_to_kind, property, value_type, closed,
#                values, description
# Optional:      sparse, expected_empty, min_value, max_value,
#                signal_count, signals
#
# value_type ∈ {string, string_array, float, int}
#   'bool' and 'bool_string' are NOT admissible — house rule R5. A closed,
#   sparse, 'true'-only entry is a PRESENCE MARKER (see the section at the end).

# ── evidence: per edge type, domains genuinely differ (spec §5.2) ────────────
Gene_has_pfam.evidence:
  applies_to: Gene_has_pfam
  applies_to_kind: edge
  property: evidence
  value_type: string
  closed: true
  values: [curated, signature, family_inferred]
  description: >
    Inference strength for this annotation. 'signature' = a direct Pfam HMM
    hit (InterProScan); 'family_inferred' = the domain is known only from
    eggNOG's ortholog-group transfer, with no direct hit. domain_inferred is
    NOT possible on this edge type.
  value_descriptions:
    curated: assigned by a human curator or a curated reference annotation (Cyanorak, UniProt, NCBI); strongest rung
    signature: direct HMM / profile hit against a member database that pre-applies its own curated threshold (InterProScan, Pfam)
    family_inferred: transferred from an ortholog family (eggNOG orthology transfer) with no direct HMM hit

Gene_catalyzes_ec_number.evidence:
  applies_to: Gene_catalyzes_ec_number
  applies_to_kind: edge
  property: evidence
  value_type: string
  closed: true
  values: [curated, family_inferred]
  description: >
    Inference strength. InterPro contributes EC only from FAMILY entries with
    a single EC, so domain_inferred is not possible on this edge type.
  value_descriptions:
    curated: assigned by a human curator or a curated reference annotation (Cyanorak, UniProt, NCBI); strongest rung
    family_inferred: transferred from an ortholog family or a single-function protein family (eggNOG orthology transfer, InterPro FAMILY entries)

Gene_involved_in_biological_process.evidence: &go_evidence
  applies_to: Gene_involved_in_biological_process
  applies_to_kind: edge
  property: evidence
  value_type: string
  closed: true
  values: [curated, family_inferred, domain_inferred]
  description: >
    Inference strength on the shared ladder curated > signature > homology >
    family_inferred > domain_inferred (homology cannot occur on this edge).
    InterPro contributes GO from FAMILY and DOMAIN entries.
  value_descriptions:
    curated: assigned by a human curator or a curated reference annotation (Cyanorak, UniProt, NCBI); strongest rung
    family_inferred: transferred from an ortholog family or a single-function protein family (eggNOG orthology transfer, InterPro FAMILY entries)
    domain_inferred: transferred from a shared domain (InterPro DOMAIN entry); weakest rung, since a domain can occur outside the annotated function

Gene_enables_molecular_function.evidence:
  <<: *go_evidence
  applies_to: Gene_enables_molecular_function

Gene_located_in_cellular_component.evidence:
  <<: *go_evidence
  applies_to: Gene_located_in_cellular_component

Gene_has_cazy_family.evidence:
  applies_to: Gene_has_cazy_family
  applies_to_kind: edge
  property: evidence
  value_type: string
  closed: true
  values: [curated, family_inferred, domain_inferred]
  description: Inference strength for this CAZy assignment.
  value_descriptions:
    curated: assigned by a human curator or a curated reference annotation (Cyanorak, UniProt, NCBI); strongest rung
    family_inferred: transferred from an ortholog family or a single-function protein family (eggNOG orthology transfer, InterPro FAMILY entries)
    domain_inferred: transferred from a shared domain (InterPro DOMAIN entry); weakest rung, since a domain can occur outside the annotated function

# ── sources: also per edge type (KG-IPT-011); each value joins DataSource.id = 'data_source:'+value ──────
Gene_has_pfam.sources:
  applies_to: Gene_has_pfam
  applies_to_kind: edge
  property: sources
  value_type: string_array
  closed: true
  values: [cyanorak, eggnog, interproscan, uniprot]
  description: >
    Who asserted this annotation. Each value joins a DataSource node via
    id = 'data_source:' + value.
  value_descriptions:
    cyanorak: Cyanorak curated cyanobacterial annotation (Prochlorococcus / Synechococcus strains only)
    eggnog: eggNOG-mapper orthology transfer from the seed ortholog group
    interproscan: InterProScan 5 domain / family scan across its member databases
    uniprot: UniProt entry for the protein (curated and automatic annotation)

Gene_catalyzes_ec_number.sources:
  applies_to: Gene_catalyzes_ec_number
  applies_to_kind: edge
  property: sources
  value_type: string_array
  closed: true
  values: [cyanorak, eggnog, interproscan, uniprot]
  description: Who asserted this annotation. Each value joins a DataSource node via id = 'data_source:' + value.
  value_descriptions:
    cyanorak: Cyanorak curated cyanobacterial annotation (Prochlorococcus / Synechococcus strains only)
    eggnog: eggNOG-mapper orthology transfer from the seed ortholog group
    interproscan: InterProScan 5 domain / family scan across its member databases
    uniprot: UniProt entry for the protein (curated and automatic annotation)

Gene_involved_in_biological_process.sources: &go_sources
  applies_to: Gene_involved_in_biological_process
  applies_to_kind: edge
  property: sources
  value_type: string_array
  closed: true
  values: [cyanorak, eggnog, interproscan, ncbi, uniprot]
  description: >
    Who asserted this annotation. Each value joins a DataSource node via id = 'data_source:' + value. ncbi contributes
    only to the GO edges.
  value_descriptions:
    cyanorak: Cyanorak curated cyanobacterial annotation (Prochlorococcus / Synechococcus strains only)
    eggnog: eggNOG-mapper orthology transfer from the seed ortholog group
    interproscan: InterProScan 5 domain / family scan across its member databases
    ncbi: NCBI RefSeq / PGAP genome annotation (GFF); contributes GO terms only
    uniprot: UniProt entry for the protein (curated and automatic annotation)

Gene_enables_molecular_function.sources:
  <<: *go_sources
  applies_to: Gene_enables_molecular_function

Gene_located_in_cellular_component.sources:
  <<: *go_sources
  applies_to: Gene_located_in_cellular_component

Gene_has_cazy_family.sources:
  applies_to: Gene_has_cazy_family
  applies_to_kind: edge
  property: sources
  value_type: string_array
  closed: true
  values: [eggnog, interproscan]
  description: Who asserted this annotation. Each value joins a DataSource node via id = 'data_source:' + value.
  value_descriptions:
    eggnog: eggNOG-mapper orthology transfer from the seed ortholog group
    interproscan: InterProScan 5 domain / family scan across its member databases

Gene_has_tcdb_family.sources:
  applies_to: Gene_has_tcdb_family
  applies_to_kind: edge
  property: sources
  value_type: string_array
  closed: true
  values: [eggnog, tcdb_diamond]
  description: >
    Evidence sources for this transporter call. Each value joins a DataSource
    node via id = 'data_source:' + value. Both entries present = cross-source
    corroboration.
  value_descriptions:
    eggnog: eggNOG-mapper orthology transfer from the seed ortholog group
    tcdb_diamond: diamond blastp vs. the curated TCDB transporter FASTA

Gene_has_tcdb_family.tier:
  applies_to: Gene_has_tcdb_family
  applies_to_kind: edge
  property: tier
  value_type: int
  closed: false
  values: []
  min_value: 1
  max_value: 3
  sparse: true
  description: >
    Both a confidence band and the truncation depth of the diamond call:
    1 = tc_specificity (identity >= 70), 2 = tc_subfamily (identity >= 40),
    3 = tc_family (no identity floor). SPARSE — rides only on diamond-sourced
    edges ('tcdb_diamond' IN sources); absent on eggNOG-only edges.

# ── evidence_score: normalized float, signals published (R4, KG-IPT-012) ─────
Gene_has_pfam.evidence_score: &score3
  applies_to: Gene_has_pfam
  applies_to_kind: edge
  property: evidence_score
  value_type: float
  closed: false
  values: []
  min_value: 0.0
  max_value: 1.0
  signal_count: 3
  signals: [multi_source, high_trust_assertion, not_domain_inferred]
  description: >
    Advisory ranking, never a filter. Fraction of independent corroborating
    signals that fired; round(score * signal_count) recovers the raw count.
    NOT calibrated against other edge types — compare within an edge type.
    Float: sort and threshold, never test equality.

Gene_catalyzes_ec_number.evidence_score:
  <<: *score3
  applies_to: Gene_catalyzes_ec_number
Gene_involved_in_biological_process.evidence_score:
  <<: *score3
  applies_to: Gene_involved_in_biological_process
Gene_enables_molecular_function.evidence_score:
  <<: *score3
  applies_to: Gene_enables_molecular_function
Gene_located_in_cellular_component.evidence_score:
  <<: *score3
  applies_to: Gene_located_in_cellular_component
Gene_has_cazy_family.evidence_score:
  <<: *score3
  applies_to: Gene_has_cazy_family

Gene_has_tcdb_family.evidence_score:
  applies_to: Gene_has_tcdb_family
  applies_to_kind: edge
  property: evidence_score
  value_type: float
  closed: false
  values: []
  min_value: 0.0
  max_value: 1.0
  signal_count: 5
  signals: [eggnog_called, source_agreement, tier_le_2,
            pfam_support, go_support]
  description: >
    Advisory ranking, never a filter. Fraction of independent corroborating
    signals that fired; round(score * signal_count) recovers the raw count.
    NOT calibrated against other edge types. Float: sort and threshold, never
    test equality.

Gene.tcdb_evidence_score_max:
  applies_to: Gene
  applies_to_kind: node
  property: tcdb_evidence_score_max
  value_type: float
  closed: false
  values: []
  min_value: 0.0
  max_value: 1.0
  sparse: true
  description: >
    Strongest TCDB claim this gene has = max(evidence_score) over its
    Gene_has_tcdb_family edges. SPARSE BY DESIGN — absent when the gene has no
    TCDB edge, so "no transporter evidence" stays distinguishable from weak
    evidence. Use coalesce(x, -1.0) for a total order.

# ── R5 conversions: two-state facts as meaningful strings ────────────────────
Gene_has_tcdb_family.source_agreement:
  applies_to: Gene_has_tcdb_family
  applies_to_kind: edge
  property: source_agreement
  value_type: string
  closed: true
  values: [both_sources, single_source]
  description: >
    Whether eggNOG and diamond concur on this TC family. Agreement is
    HIERARCHICAL (ancestor or descendant), not exact-node — the two sources
    usually concur at different depths.
  value_descriptions:
    both_sources: eggNOG and diamond both called this family or an ancestor / descendant of it; cross-source corroboration
    single_source: only one of eggNOG or diamond called this family (no call from the other at any depth)

Gene_has_tcdb_family.pfam_support:
  applies_to: Gene_has_tcdb_family
  applies_to_kind: edge
  property: pfam_support
  value_type: string
  closed: true
  values: [corroborated, uncorroborated]
  description: >
    Whether a Pfam domain on this gene is curated into this TC family via
    Tcdb_family_has_pfam_domain. Read in the sound direction only.
  value_descriptions:
    corroborated: the gene carries a Pfam domain that TCDB curates into this transport family
    uncorroborated: no Pfam domain on the gene is curated into this family; absence of support, not contradiction

Gene_has_tcdb_family.go_support:
  applies_to: Gene_has_tcdb_family
  applies_to_kind: edge
  property: go_support
  value_type: string
  closed: true
  values: [corroborated, uncorroborated]
  description: >
    Whether a GO term on this gene is curated onto this TC family. Not
    redundant with pfam_support — 11,565 edges carry exactly one of the two.
  value_descriptions:
    corroborated: the gene carries a GO term that TCDB curates onto this transport family
    uncorroborated: no GO term on the gene is curated onto this family; absence of support, not contradiction

Tcdb_family_transports_metabolite.substrate_depth:
  applies_to: Tcdb_family_transports_metabolite
  applies_to_kind: edge
  property: substrate_depth
  value_type: string
  closed: true
  values: [most_specific, inherited]
  description: >
    A (node, substrate) fact, not a node fact — 2.A.1 can be most_specific for
    one substrate and inherited for another. most_specific = no kept child of
    this node carries the same substrate. Use this, NOT
    level_kind = 'tc_specificity', to recover leaf substrate semantics.
  value_descriptions:
    most_specific: no kept child of this family carries the same substrate; this is the most specific surviving transporter system for it
    inherited: rolled up from a descendant that also carries the substrate; count the descendant, not this node

Gene.transport_substrate_resolution:
  applies_to: Gene
  applies_to_kind: node
  property: transport_substrate_resolution
  value_type: string
  closed: true
  sparse: true
  values: [resolved, family_inferred]
  description: >
    How specific this gene's transport substrate claim is. family_inferred =
    its deepest TC attachment lumps many substrates, so the count is
    reachability, not capability. SPARSE — absent when the gene has no TCDB
    edge, so "no evidence" stays distinguishable from a weak claim.

# ── InterPro ────────────────────────────────────────────────────────────────
InterproEntry.interpro_type:
  # provenance (moved out of the researcher-facing description, 2026-08-29):
  #   InterPro entry class. PRIMARY stratification key for ORA over InterPro — breadth varies by
  #   type far more than by level. Preserved in InterPro's own UPPERCASE casing (not lowercased
  #   per house rule R1) because this is InterPro's own controlled vocabulary term, kept verbatim
  #   so it stays directly comparable to the source.
  applies_to: InterproEntry
  applies_to_kind: node
  property: interpro_type
  value_type: string
  closed: true
  values: [FAMILY, DOMAIN, HOMOLOGOUS_SUPERFAMILY, REPEAT, CONSERVED_SITE,
           ACTIVE_SITE, BINDING_SITE, PTM]
  description: >
    InterPro entry class (FAMILY, DOMAIN, HOMOLOGOUS_SUPERFAMILY,
    CONSERVED_SITE, ACTIVE_SITE, REPEAT, BINDING_SITE, PTM). The primary
    stratification key for enrichment over InterPro: entry breadth varies far
    more by type than by hierarchy level. InterPro's own upper-case terms,
    kept verbatim.

InterproEntry.level_kind:
  applies_to: InterproEntry
  applies_to_kind: node
  property: level_kind
  value_type: string
  closed: true
  values: []
  expected_empty: true
  description: >
    InterPro depth tiers have no natural names. Emit null. Stratify ORA by
    (interpro_type, level) — interpro_type primary, level secondary.

Gene_has_interpro_entry.libraries:
  # provenance (moved out of the researcher-facing description, 2026-08-29):
  #   InterProScan member databases that produced a match for this entry. The member-DB
  #   granularity of the signature-vs-inferred distinction — 'PFAM' means a direct HMM hit.
  #   Preserved in InterProScan's own UPPERCASE casing (not lowercased per house rule R1) because
  #   these are InterProScan's own controlled vocabulary terms, kept verbatim so they stay
  #   directly comparable to the source.
  applies_to: Gene_has_interpro_entry
  applies_to_kind: edge
  property: libraries
  value_type: string_array
  closed: true
  values: [CDD, GENE3D, HAMAP, NCBIFAM, PANTHER, PFAM, PIRSF, PRINTS,
           PROSITE_PATTERNS, PROSITE_PROFILES, SFLD, SMART, SUPERFAMILY]
  description: >
    InterProScan member databases that matched this entry for this gene (e.g.
    PFAM, PANTHER, GENE3D). More libraries = independent corroboration of the
    same entry; 'PFAM' means a direct HMM hit. InterProScan's own upper-case
    names, kept verbatim.

# ── Released vocabularies (harvested, not designed — spec §5.3 second group) ─
# These vocabularies were already shipped and are read by the MCP explorer;
# renaming any value here is a breaking change and out of scope. Harvested
# from multiomics_kg/vocab/non_de_evidence.py, multiomics_kg/utils/brite_utils.py,
# schema_config.yaml, and CLAUDE.md "Key graph facts" (no live Neo4j available
# in this environment — see task-10-report.md for the harvest method and every
# code-vs-CLAUDE.md mismatch found).

Experiment.omics_type:
  # provenance (moved out of the researcher-facing description, 2026-08-29):
  #   Omics modality of this experiment. Harvested from EXTENDED_OMICS_TYPES in
  #   multiomics_kg/vocab/non_de_evidence.py, which scripts/validate_paperconfig.py assigns
  #   verbatim to VALID_TYPES — the two are the same set, no reconciliation needed. Shipped as
  #   UPPERCASE_SNAKE_CASE (pre-existing convention; not lowercased per the vocabulary-contract's
  #   no-rename rule for released values).
  applies_to: Experiment
  applies_to_kind: node
  property: omics_type
  value_type: string
  closed: true
  values: [RNASEQ, MICROARRAY, PROTEOMICS, EXOPROTEOMICS, VESICLE_PROTEOMICS,
           METABOLOMICS, PAIRED_RNASEQ_PROTEOME, DNASEQ, VESICLE_DNASEQ]
  description: >
    Omics modality of the experiment (RNASEQ, PROTEOMICS, MICROARRAY,
    METABOLOMICS, EXOPROTEOMICS, ...). Upper-case snake_case by long-standing
    convention.

Experiment.compartment:
  # provenance (moved out of the researcher-facing description, 2026-08-29):
  #   COMPARTMENTS in multiomics_kg/vocab/non_de_evidence.py (validator + adapters
  #   import it). spent_medium and lysate were declared until 2026-08-29 but never
  #   emitted on any label (DOC-004) — pruned; re-add when a paper needs them.
  applies_to: Experiment
  applies_to_kind: node
  property: compartment
  value_type: string
  closed: true
  values: [whole_cell, vesicle, exoproteome, extracellular]
  description: >
    Subcellular fraction this experiment measured; default whole_cell.
    exoproteome is the proteomics term for secreted proteins recovered from
    the medium; extracellular is the general outside-the-cell pool used by
    metabolomics; vesicle is the extracellular-vesicle fraction.
  value_descriptions:
    whole_cell: intracellular / whole-cell fraction (the default)
    vesicle: extracellular-vesicle fraction
    exoproteome: secreted proteins recovered from the culture medium (proteomics convention)
    extracellular: general outside-the-cell pool, used by metabolomics

Experiment.table_scope:
  # provenance (moved out of the researcher-facing description, 2026-08-29):
  #   What genes the source DE table contains. No controlled-list constant exists in code (the
  #   adapter passes the paperconfig value through unvalidated) — harvested from CLAUDE.md "Key
  #   graph facts" per the controller ruling designating CLAUDE.md as authority here.
  applies_to: Experiment
  applies_to_kind: node
  property: table_scope
  value_type: string
  closed: true
  values: [all_detected_genes, significant_any_timepoint, significant_only,
           top_n, filtered_subset]
  description: >
    What genes the source differential-expression table contains:
    all_detected_genes, significant_any_timepoint, significant_only, top_n, or
    filtered_subset. Absent on experiments with no DE table (metabolomics /
    derived-metric-only). Read it before treating a table as a genome-wide
    background.
  value_descriptions:
    all_detected_genes: every gene detected in the experiment, significant or not; a usable genome-wide background
    significant_any_timepoint: genes significant at one or more time points, reported at every time point; not a background
    significant_only: only genes passing the significance threshold; not a background
    top_n: a fixed-size list of the strongest responders; not a background
    filtered_subset: a subset chosen by the authors on other criteria (see table_scope_detail); not a background

ClusteringAnalysis.cluster_type:
  # provenance (moved out of the researcher-facing description, 2026-08-29):
  #   What kind of gene grouping a clustering analysis is (paperconfig
  #   `gene_clusters.cluster_type`, validated by scripts/validate_paperconfig.py
  #   VALID_CLUSTER_TYPES). Registered 2026-08-27 (KG-SYNC-006) when the GEO pass added
  #   `decay_pattern` (Steglich 2010 mRNA-decay profile clusters) and `genomic_island` (Hackl 2023
  #   predicted genomic islands as gene sets).
  applies_to: ClusteringAnalysis
  applies_to_kind: node
  property: cluster_type
  value_type: string
  closed: true
  values: [time_course, diel, condition_comparison, expression_bin,
           decay_pattern, genomic_island]
  description: >
    What kind of gene grouping the analysis is: time_course, diel,
    condition_comparison, expression_bin, decay_pattern (mRNA-decay profiles,
    Steglich 2010) or genomic_island (predicted islands as gene sets, Hackl
    2023).

DerivedMetric.value_kind:
  # provenance (moved out of the researcher-facing description, 2026-08-29):
  #   Discriminator driving adapter edge-type dispatch (numeric->quantifies_gene,
  #   boolean->flags_gene, categorical->classifies_gene). Harvested from VALUE_KINDS in
  #   multiomics_kg/vocab/non_de_evidence.py; confirmed against schema_config.yaml's inline
  #   comment on the `derived metric` node.
  applies_to: DerivedMetric
  applies_to_kind: node
  property: value_kind
  value_type: string
  closed: true
  values: [numeric, boolean, categorical]
  description: >
    Kind of value the metric assigns to each gene: numeric (quantifies edges,
    rankable), boolean (flags edges) or categorical (classifies edges).
    Determines which measurement edge type the metric emits.

MetaboliteAssay.value_kind:
  # provenance (moved out of the researcher-facing description, 2026-08-29):
  #   schema_config.yaml's inline comment on the `metabolite assay` node; VALUE_KINDS
  #   in non_de_evidence.py is shared code but not enforced per-label, so the two
  #   labels legitimately differ (per-edge-type `evidence` precedent, spec §5.2).
  applies_to: MetaboliteAssay
  applies_to_kind: node
  property: value_kind
  value_type: string
  closed: true
  values: [numeric, boolean]
  description: >
    Kind of value this assay reports per metabolite: numeric (a concentration
    or abundance, carried on Assay_quantifies_metabolite) or boolean (a
    presence call, carried on Assay_flags_metabolite). Same discriminator as
    DerivedMetric.value_kind but narrower — MetaboliteAssay has no
    categorical arm.

DerivedMetric.metric_type:
  # provenance (moved out of the researcher-facing description, 2026-08-29):
  #   KNOWN_METRIC_TYPES keys in multiomics_kg/vocab/non_de_evidence.py. RESCOPED
  #   (2026-08-18) closed:true -> closed:false: the registry is a SOFT allowlist by
  #   design (a metric_type absent from it is accepted with a validator warning),
