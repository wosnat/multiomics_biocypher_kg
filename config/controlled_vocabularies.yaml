  value_type: string
  closed: true
  values: [homology]
  description: >
    Rung of the shared inference-strength ladder curated > signature >
    homology > family_inferred > domain_inferred (KG-SYNC-005 / ONT-008).
    Direct blastp hit vs. the curated MEROPS scan library; strength WITHIN
    homology is read from `tier`. Orthogonal to call_class (the verdict axis):
    a nonpeptidase_homolog is still homology evidence for the placement.

Gene_has_tcdb_family.evidence:
  applies_to: Gene_has_tcdb_family
  applies_to_kind: edge
  property: evidence
  value_type: string
  closed: true
  values: [family_inferred, homology]
  description: >
    Rung of the shared inference-strength ladder curated > signature >
    homology > family_inferred > domain_inferred (KG-SYNC-005 / ONT-008).
    homology = diamond called it (direct blastp vs. the curated TCDB FASTA;
    strength within it from `tier`); family_inferred = eggNOG-only (orthology
    transfer). Both-source edges take the strongest (homology).

Gene_has_merops_family.evidence_score:
  applies_to: Gene_has_merops_family
  applies_to_kind: edge
  property: evidence_score
  value_type: float
  closed: false
  values: []
  min_value: 0.0
  max_value: 1.0
  signal_count: 2
  signals: [tier_le_2, pfam_support]
  description: >
    Advisory placement-confidence ranking, never a filter (ONT-006, R4). Two
    independent signals: tier <= 2 (identity >= 40%) and pfam_support =
    'corroborated'. Scale is {0, 0.5, 1}; round(score * 2) recovers the fired
    count. call_class is deliberately NOT a signal — it is the verdict axis
    (active peptidase?), read separately. NOT calibrated against the 5-signal
    Gene_has_tcdb_family.evidence_score.

Gene.merops_evidence_score_max:
  applies_to: Gene
  applies_to_kind: node
  property: merops_evidence_score_max
  value_type: float
  closed: false
  values: []
  sparse: true
  min_value: 0.0
  max_value: 1.0
  description: >
    max(evidence_score) over the gene's Gene_has_merops_family edges (ONT-013,
    mirror of tcdb_evidence_score_max). SPARSE — absent when the gene has no
    MEROPS edge; coalesce(x, -1.0) for a total order. Read alongside
    Gene.merops_classes: this says how well the best call is PLACED,
    merops_classes says whether any call is an active peptidase.

Gene_has_tcdb_family.attachment_depth:
  applies_to: Gene_has_tcdb_family
  applies_to_kind: edge
  property: attachment_depth
  value_type: string
  closed: true
  values: [most_specific, superseded]
  description: >
    Post-import structural fact (ONT-010, not a threshold — R3 does not apply).
    'superseded' = another Gene_has_tcdb_family edge of the SAME gene lands on a
    descendant of this node (e.g. eggNOG 3.A.1 next to diamond 3.A.1.14) — a
    less specific call, NOT a wrong one. 'most_specific' = no such sibling.
    The transport-arm counts (Gene.transported_metabolite_count,
    Metabolite.transporter_gene_count, Organism_has_metabolite) read only
    most_specific edges. Mirrors substrate_depth's value grammar.

Gene_has_interpro_entry.evalue:
  applies_to: Gene_has_interpro_entry
  applies_to_kind: edge
  property: evalue
  value_type: float
  closed: false
  values: []
  sparse: true
  min_value: 0.0
  description: >
    Best (min) e-value across this gene's matches to the entry; SPARSE —
    omitted when no match reports one (~30% of edges). Libraries that never
    report an e-value (measured over the committed calls.json, 2026-08-27):
    COILS, HAMAP, MOBIDB_LITE, PANTHER, PRINTS, PROSITE_PATTERNS, PROSITE_PROFILES, SUPERFAMILY. Evidence only, NEVER a filter — each member DB pre-applies
    its own curated threshold.

Gene_has_interpro_entry.match_count:
  applies_to: Gene_has_interpro_entry
  applies_to_kind: edge
  property: match_count
  value_type: int
  closed: false
  values: []
  min_value: 0
  description: >
    Number of member-DB match×location rows folded into this edge. Read
    size(libraries) for cross-library corroboration, match_count for volume.

Gene_has_ncbifam_family.evalue:
  applies_to: Gene_has_ncbifam_family
  applies_to_kind: edge
  property: evalue
  value_type: float
  closed: false
  values: []
  min_value: 0.0
  description: >
    HMMER e-value of the best NCBIFAM facet row for this (gene, family). Dense.

Gene_has_ncbifam_family.bit_score:
  applies_to: Gene_has_ncbifam_family
  applies_to_kind: edge
  property: bit_score
  value_type: float
  closed: false
  values: []
  min_value: 0.0
  description: >
    HMMER bit score of the best NCBIFAM facet row (ONT-011: renamed from
    `score`, which is PSORTb's unrelated confidence scale). Single homogeneous
    library, so evalue AND bit_score are both meaningful.

Gene_has_ncbifam_family.start:
  applies_to: Gene_has_ncbifam_family
  applies_to_kind: edge
  property: start
  value_type: int
  closed: false
  values: []
  min_value: 1
  description: >
    Alignment start (1-based residue) of the best facet row.

Gene_has_ncbifam_family.end:
  applies_to: Gene_has_ncbifam_family
  applies_to_kind: edge
  property: end
  value_type: int
  closed: false
  values: []
  min_value: 1
  description: >
    Alignment end (1-based residue) of the best facet row.

Gene_has_tcdb_family.confidence_score:
  applies_to: Gene_has_tcdb_family
  applies_to_kind: edge
  property: confidence_score
  value_type: float
  closed: false
  values: []
  sparse: true
  min_value: 0.0
  max_value: 1.0
  description: >
    tcdb-diamond native per-call confidence in [0,1] (NOT the R4 evidence_score;
    tool-internal scale, never compared across ontologies). SPARSE — present only on diamond-called edges (absent on eggNOG-only).

Gene_has_tcdb_family.identity:
  applies_to: Gene_has_tcdb_family
  applies_to_kind: edge
  property: identity
  value_type: float
  closed: false
  values: []
  sparse: true
  min_value: 0.0
  max_value: 100.0
  description: >
    blastp percent identity of the consensus best hit (0-100). SPARSE — present only on diamond-called edges (absent on eggNOG-only).

Gene_has_tcdb_family.qcov:
  applies_to: Gene_has_tcdb_family
  applies_to_kind: edge
  property: qcov
  value_type: float
  closed: false
  values: []
  sparse: true
  min_value: 0.0
  max_value: 1.0
  description: >
    Query coverage of the best hit, fraction in [0,1]. SPARSE — present only on diamond-called edges (absent on eggNOG-only).

Gene_has_tcdb_family.evalue:
  applies_to: Gene_has_tcdb_family
  applies_to_kind: edge
  property: evalue
  value_type: float
  closed: false
  values: []
  sparse: true
  min_value: 0.0
  description: >
    blastp e-value of the best hit. SPARSE — present only on diamond-called edges (absent on eggNOG-only).

Gene_has_tcdb_family.consensus_n:
  applies_to: Gene_has_tcdb_family
  applies_to_kind: edge
  property: consensus_n
  value_type: int
  closed: false
  values: []
  sparse: true
  min_value: 1
  description: >
    Number of hits agreeing on this call after consensus collapse. SPARSE — present only on diamond-called edges (absent on eggNOG-only).

Gene_has_merops_family.confidence_score:
  applies_to: Gene_has_merops_family
  applies_to_kind: edge
  property: confidence_score
  value_type: float
  closed: false
  values: []
  min_value: 0.0
  max_value: 1.0
  description: >
    merops-diamond native per-call confidence in [0,1] (NOT the R4 evidence_score;
    tool-internal scale, never compared across ontologies). Dense — every edge is diamond-sourced.

Gene_has_merops_family.identity:
  applies_to: Gene_has_merops_family
  applies_to_kind: edge
  property: identity
  value_type: float
  closed: false
  values: []
  min_value: 0.0
  max_value: 100.0
  description: >
    blastp percent identity of the consensus best hit (0-100). Dense — every edge is diamond-sourced.

Gene_has_merops_family.qcov:
  applies_to: Gene_has_merops_family
  applies_to_kind: edge
  property: qcov
  value_type: float
  closed: false
  values: []
  min_value: 0.0
  max_value: 1.0
  description: >
    Query coverage of the best hit, fraction in [0,1]. Dense — every edge is diamond-sourced.

Gene_has_merops_family.evalue:
  applies_to: Gene_has_merops_family
  applies_to_kind: edge
  property: evalue
  value_type: float
  closed: false
  values: []
  min_value: 0.0
  description: >
