# ── MEROPS + NCBIfam + InterPro evalue_library (2026-08-18 merge) ────────────
# MEROPS vocab (level_kind, family_type, call_class, best_hit_kind) is
# KG-minted and verified against multiomics_kg/utils/merops_diamond.py's
# CATALYTIC_TYPE_WORDS / call_class() / id_kind() and
# config/schema_config.yaml's `merops family` / `gene to merops family
# association` blocks. NcbifamFamily.family_type and
# Gene_has_interpro_entry.evalue_library are external controlled vocabulary
# (NCBIfam's own label / InterProScan's own member-DB name) and are
# preserved verbatim per house rule R1's external-source exception.

MeropsFamily.level_kind:
  applies_to: MeropsFamily
  applies_to_kind: node
  property: level_kind
  value_type: string
  closed: true
  values: [merops_clan, merops_family, merops_subfamily]
  description: >
    KG-minted depth tier for a MEROPS clan/family/subfamily node. Harvested
    from classify_code() in multiomics_kg/utils/merops_diamond.py (returns
    (0, 'merops_clan') / (1, 'merops_family') / (2, 'merops_subfamily'));
    matches config/schema_config.yaml's `merops family` node comment
    "level: int  # 0=merops_clan, 1=merops_family, 2=merops_subfamily"
    exactly.

MeropsFamily.family_class:
  applies_to: MeropsFamily
  applies_to_kind: node
  property: family_class
  value_type: string
  closed: true
  values: [peptidase, inhibitor]
  description: >
    KG-minted two-state label for a MEROPS family/subfamily/clan. Renamed
    from family_type (KG-SYNC-005 / ONT-012, R1b): the same property name on
    NcbifamFamily holds an unrelated external vocabulary. Harvested
    from family_type() in multiomics_kg/utils/merops_diamond.py ("inhibitor"
    for I-prefixed codes, else "peptidase"); matches
    config/schema_config.yaml's `merops family` node comment
    `family_type: str  # "peptidase" | "inhibitor" (I-families)` exactly.

MeropsFamily.catalytic_type:
  applies_to: MeropsFamily
  applies_to_kind: node
  property: catalytic_type
  value_type: string
  closed: true
  sparse: true
  values: [serine, cysteine, metallo, aspartic, threonine, glutamic,
           asparagine_lyase, mixed, unknown]
  description: >
    KG-minted full-word spelling of MEROPS's single-letter catalytic-type
    code — MEROPS ships "S"/"C"/"M"/etc, the KG spells them out so the
    values read correctly without a lookup table. Harvested verbatim from
    the VALUES of CATALYTIC_TYPE_WORDS in
    multiomics_kg/utils/merops_diamond.py. SPARSE — null for inhibitor
    families (catalytic_type_word() returns None when the code starts with
    "I"), matching config/schema_config.yaml's `null for inhibitors` note.

Gene_has_merops_family.call_class:
  applies_to: Gene_has_merops_family
  applies_to_kind: edge
  property: call_class
  value_type: string
  closed: true
  values: [peptidase, inhibitor, nonpeptidase_homolog]
  description: >
    KG-minted read-first verdict for one Gene_has_merops_family candidate.
    Harvested from the three return statements of call_class() in
    multiomics_kg/utils/merops_diamond.py: 'inhibitor' when the family is an
    I-family, 'nonpeptidase_homolog' when the best hit is a catalytically
    dead .9xx entry, else 'peptidase'. Threshold-free, mirrors the
    expression_status pattern.

Gene_has_merops_family.best_hit_kind:
  applies_to: Gene_has_merops_family
  applies_to_kind: edge
  property: best_hit_kind
  value_type: string
  closed: true
  values: [holotype, putative, nonpeptidase_homolog]
  description: >
    KG-minted entry-kind label for a candidate's best (highest-identity)
    MEROPS identifier hit. Harvested from id_kind() in
    multiomics_kg/utils/merops_diamond.py: "holotype" for a characterized
    numeric tail (001-899), "nonpeptidase_homolog" for a 9xx tail, "putative"
    for a letter-prefixed tail; matches config/schema_config.yaml's `gene to
    merops family association` comment
    `best_hit_kind: str  # holotype | putative | nonpeptidase_homolog`.

NcbifamFamily.family_type:
  applies_to: NcbifamFamily
  applies_to_kind: node
  property: family_type
  value_type: string
  closed: true
  values: [PfamAutoEq, PfamEq, domain, equivalog, equivalog_domain, exception,
           hypoth_equivalog, hypoth_equivalog_domain, paralog, paralog_domain,
           repeat, retired, signature, subfamily, subfamily_domain, superfamily]
  description: >
    NCBIfam/TIGRFAM's own specificity-label vocabulary (flat ontology, no
    hierarchy column in source), plus ONE KG-minted sentinel: 'retired' marks
    an accession a strain's InterProScan run still calls but the current
    NCBIfam reference release no longer lists (10 nodes, all NF*; ONT-004) —
    the node keeps its calls.json name and no other reference field. EXTERNAL — preserved verbatim in NCBIfam's
    own mixed casing (including "PfamEq" / "PfamAutoEq", not lowercased or
    snake_cased) per house rule R1's external-source exception, so the graph
    stays directly comparable to the NCBIfam reference data. Harvested by
    scanning the distinct `family_type` values across all 38,394 entries in
    cache/data/ncbifam/ncbifam_reference.json (built by prepare_data step 9 /
    build_ncbifam_reference.py); confirmed against
    config/schema_config.yaml's `ncbifam family` node comment listing the
    same value set.

Gene_has_interpro_entry.evalue_library:
  applies_to: Gene_has_interpro_entry
  applies_to_kind: edge
  property: evalue_library
  value_type: string
  closed: true
  sparse: true
  values: [CDD, GENE3D, HAMAP, NCBIFAM, PANTHER, PFAM, PIRSF, PRINTS,
           PROSITE_PATTERNS, PROSITE_PROFILES, SFLD, SMART, SUPERFAMILY]
  description: >
    Which InterProScan member database reported the edge's (best/min)
    evalue. EXTERNAL — same UPPERCASE member-DB name set as the existing
    Gene_has_interpro_entry.libraries entry, copied verbatim per house rule
    R1's external-source exception (InterProScan's own controlled
    vocabulary, kept comparable to the source); not lowercased. SPARSE — set
    only when a match reports an evalue at all (~58% of matches, per
    schema_config.yaml's `evalue` comment "omitted when all matches lack
    one"); a gene's edge with no reporting library carries no
    evalue_library.

# ── MEROPS peptidase layer: 2026-08-18 follow-up entries (tier / pfam_support /
#    cleavage_p1_residues / member_id_count / merops_classes). Pre-existing
#    entries (call_class / best_hit_kind / level_kind / family_type / catalytic_type)
#    declared above. Spec: docs/superpowers/specs/2026-08-18-merops-pfam-bridge-cleavage-design.md ──

Gene_has_merops_family.tier:
  applies_to: Gene_has_merops_family
  applies_to_kind: edge
  property: tier
  value_type: int
  closed: false
  values: []
  min_value: 1
  max_value: 3
  description: >
    tcdb-diamond confidence band and truncation depth: 1 = MEROPS identifier
    (identity >= 70), 2 = subfamily (identity >= 40), 3 = family (floor only).
    NOT sparse — unlike Gene_has_tcdb_family.tier, every merops edge is
    diamond-sourced and carries one. ~92% tier 3 (expected remote homology).

Gene_has_merops_family.pfam_support:
  applies_to: Gene_has_merops_family
  applies_to_kind: edge
  property: pfam_support
  value_type: string
  closed: true
  values: [corroborated, uncorroborated]
  description: >
    Whether a Pfam domain on this gene is curated into this MEROPS family via
    Merops_family_has_pfam_domain. Read in the sound direction only.

MeropsFamily.cleavage_p1_residues:
  applies_to: MeropsFamily
  applies_to_kind: node
  property: cleavage_p1_residues
  value_type: string_array
  closed: true
  values: [Ala, Arg, Asn, Asp, Cys, Gln, Glu, Gly, His, Ile,
           Leu, Lys, Met, Phe, Pro, Ser, Thr, Trp, Tyr, Val]
  sparse: true
  description: >
    Top P1 residues (Schechter-Berger: the residue N-terminal of the scissile
    bond) with >= 10% share of curated cleavages, max 3, frequency order.
    Filtered to the 20 standard residues. SPARSE — level-1 families with
    curated cleavage data only; read known_cleavage_count for support.

Merops_family_has_pfam_domain.member_id_count:
  applies_to: Merops_family_has_pfam_domain
  applies_to_kind: edge
  property: member_id_count
  value_type: int
  closed: false
  values: []
  min_value: 1
  description: >
    How many distinct curated MEROPS identifiers back this (family, Pfam)
    pair in MEROPS's interpro.txt. Support size, not a filter.

Gene.merops_classes:
  applies_to: Gene
  applies_to_kind: node
  property: merops_classes
  value_type: string_array
  closed: true
  values: [peptidase, inhibitor, nonpeptidase_homolog]
  description: >
    Sorted distinct call_class values across the gene's Gene_has_merops_family
    edges — the at-a-glance guard so a gene whose only call is a dead homolog
    never reads as "1 protease". Empty when the gene has no merops edge.

