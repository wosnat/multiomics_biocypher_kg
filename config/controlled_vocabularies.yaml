  applies_to_kind: edge
  property: member_id_count
  value_type: int
  closed: false
  values: []
  min_value: 1
  description: >
    How many distinct curated MEROPS identifiers back this (family, Pfam)
    pair in the MEROPS interpro.txt. Support size, not a filter.

Gene.merops_classes:
  applies_to: Gene
  applies_to_kind: node
  property: merops_classes
  value_type: string_array
  closed: true
  values: [peptidase, inhibitor, nonpeptidase_homolog]
  description: >
    Sorted distinct call_class values across the Gene_has_merops_family edges of the gene — the at-a-glance guard so a gene whose only call is a dead homolog
    never reads as "1 protease". Empty when the gene has no merops edge.

