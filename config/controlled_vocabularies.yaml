BiologicalProcess.level_is_best_effort:
  applies_to: BiologicalProcess
  applies_to_kind: node
  property: level_is_best_effort
  value_type: string
  closed: true
  values: ['true']
  sparse: true
  description: >
    PRESENCE MARKER emitted by go_adapter on GO DAG terms whose min-path and
    max-path depth to the namespace root differ, so the integer `level` is a
    min-path approximation rather than an exact depth. Absent when the two
    depths agree. Only GO labels ever carry it (the other ontologies are
    trees). Test with `IS NOT NULL`.
  value_descriptions:
    'true': level is a best-effort min-path depth (DAG term with multiple root paths); absence means level is exact

