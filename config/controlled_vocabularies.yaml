Gene.annotation_state:
  # provenance (moved out of the researcher-facing description, 2026-08-29):
  #   Inline literals in scripts/post-import.sh's annotation_state CASE expression;
  #   no controlled-list constant exists in code.
  applies_to: Gene
  applies_to_kind: node
  property: annotation_state
  value_type: string
  closed: true
  values: [no_evidence, catch_all_only, informative_single, informative_multi]
  description: >
    Post-import qualitative annotation bucket, the string form of the numeric
    annotation_quality (0-3): how many independent informative source buckets
    (GO, KEGG, Pfam, EC, role, reaction, transporter, CAZy, NCBIfam) back
    this gene, after uninformative terms are discounted. The transporter
    bucket counts a gene with a TCDB edge that passes the annotation gate
    (tcdb_gate = `direct` or `annotated`: any eggnog call, a diamond tier call
    with tier at most 2, or a rank-1 diamond best hit with tier at most 2).
  value_descriptions:
    no_evidence: no functional annotation edge of any kind (annotation_quality 0)
    catch_all_only: only uninformative terms, e.g. hypothetical protein, DUF, general function prediction only (annotation_quality 1)
    informative_single: an informative term from exactly one source bucket (annotation_quality 2)
    informative_multi: informative terms from two or more independent source buckets (annotation_quality 3)

