# Curated exceptions to TcdbFamily.direction (multiomics_kg.utils.tcdb_utils.tcdb_direction).
#
# The rule reads direction from TCDB names (and ABC numbering 3.A.1.1-99). Some TCDB
# names overstate what is known about a node or its members; an entry here makes the
# KG say `unknown` instead. Entries can only REMOVE a direction, never assert one:
# a false `unknown` is cheap, a wrong direction is not.
#
# Format: <TC id>: {scope: subtree | node, reason: <why, with a reference>}
#   subtree  the node and every descendant read `unknown`.
#   node     the node's own name never decides and is never inherited: its members
#            get a direction only from their own names. For families named after one
#            characterised member whose relatives go the other way or are uncharacterised.
# A unit test checks every id is in the committed TCDB hierarchy.
# Source: 2026-10-24 seven-reviewer audit of all directed nodes (docs/kg-changes/tcdb-cleanup.md).

